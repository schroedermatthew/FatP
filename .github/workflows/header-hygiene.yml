# =============================================================================
# .github/workflows/header-hygiene.yml
# =============================================================================
# CI workflow to verify Fat-P header hygiene:
# 1. All headers are self-contained (compile standalone)
# 2. IncludeAllFatPHeaders.h compiles (no ODR/include-order issues)
# =============================================================================

name: Header Hygiene

on:
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Header Self-Containment (Linux GCC/Clang, C++20/C++23)
  # ===========================================================================
  header-self-containment:

    name: Self-Containment ${{ matrix.compiler }} C++${{ matrix.std }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: g++-13
            std: 20
          - runner: ubuntu-24.04
            compiler: g++-14
            std: 23
          - runner: ubuntu-22.04
            compiler: clang++-16
            std: 20
          - runner: ubuntu-22.04
            compiler: clang++-17
            std: 23

    steps:
      - uses: actions/checkout@v6

      - name: Install Compiler
        run: |
          sudo apt-get update
          if [[ "${{ matrix.compiler }}" == clang* ]]; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            version=$(echo "${{ matrix.compiler }}" | grep -oP '\d+')
            sudo ./llvm.sh $version
          else
            sudo apt-get install -y ${{ matrix.compiler }}
          fi

      - name: Check Header Self-Containment
        run: |
          echo "Checking header self-containment with ${{ matrix.compiler }} -std=c++${{ matrix.std }}"

          FAILED=0
          PASSED=0

          for header in include/fat_p/*.h; do
            header_name=$(basename "$header")

            echo "#include \"$header_name\"" > test_sc.cpp
            echo "int main() { return 0; }" >> test_sc.cpp

            if ${{ matrix.compiler }} -std=c++${{ matrix.std }} \
               -Wall -Wextra -Wpedantic -Werror \
               -I./include/fat_p \
               -c test_sc.cpp -o /dev/null 2>/dev/null; then
              PASSED=$((PASSED + 1))
            else
              echo "[FAIL] $header_name"
              ${{ matrix.compiler }} -std=c++${{ matrix.std }} \
                -Wall -Wextra -I./include/fat_p \
                -c test_sc.cpp -o /dev/null 2>&1 | head -10
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Results: $PASSED passed, $FAILED failed"

          if [ $FAILED -gt 0 ]; then
            exit 1
          fi
          echo "All headers are self-contained"

  # ===========================================================================
  # Include All Headers (Linux GCC/Clang, C++20/C++23)
  # ===========================================================================
  include-all-headers:

    name: Include-All ${{ matrix.compiler }} C++${{ matrix.std }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: g++-13
            std: 20
          - runner: ubuntu-24.04
            compiler: g++-14
            std: 23
          - runner: ubuntu-22.04
            compiler: clang++-16
            std: 20
          - runner: ubuntu-22.04
            compiler: clang++-17
            std: 23

    steps:
      - uses: actions/checkout@v6

      - name: Install Compiler
        run: |
          sudo apt-get update
          if [[ "${{ matrix.compiler }}" == clang* ]]; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            version=$(echo "${{ matrix.compiler }}" | grep -oP '\d+')
            sudo ./llvm.sh $version
          else
            sudo apt-get install -y ${{ matrix.compiler }}
          fi

      - name: Compile IncludeAllFatPHeaders.h
        run: |
          echo "Compiling IncludeAllFatPHeaders.h with ${{ matrix.compiler }} -std=c++${{ matrix.std }}"

          echo '#include "IncludeAllFatPHeaders.h"' > test_include_all.cpp
          echo 'int main() { return 0; }' >> test_include_all.cpp

          ${{ matrix.compiler }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -I./components/FatPTest/tests \
            -c test_include_all.cpp -o /dev/null

          echo "IncludeAllFatPHeaders.h compiles successfully"

  # ===========================================================================
  # Windows MSVC Header Check (C++20/C++23)
  # ===========================================================================
  windows-header-check:

    name: Windows MSVC C++${{ matrix.std }} Header Check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Check Headers with MSVC
        run: |
          $stdFlag = if (${{ matrix.std }} -eq 23) { "/std:c++latest" } else { "/std:c++${{ matrix.std }}" }

          $failed = 0
          $passed = 0

          Get-ChildItem "include\fat_p\*.h" | ForEach-Object {
            $headerName = $_.Name
            Set-Content -Path "test_header.cpp" -Value "#include `"$headerName`"`nint main() { return 0; }"

            $output = cl $stdFlag /W4 /WX /wd4324 /EHsc /permissive- /Zc:preprocessor /I.\include\fat_p /c test_header.cpp 2>&1
            if ($LASTEXITCODE -eq 0) {
              $passed++
            } else {
              Write-Host "[FAIL] $headerName"
              $output | Select-Object -First 10 | Write-Host
              $failed++
            }
          }

          Write-Host ""
          Write-Host "Results: $passed passed, $failed failed"

          if ($failed -gt 0) { exit 1 }
          Write-Host "All headers compile with MSVC"

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  hygiene-success:
    name: Header Hygiene Success
    needs: [header-self-containment, include-all-headers, windows-header-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.header-self-containment.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.include-all-headers.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-header-check.result }}" != "success" ]]; then exit 1; fi
          echo "All header hygiene checks passed"
