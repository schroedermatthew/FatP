# =============================================================================
# .github/workflows/aligned_vector.yml
# =============================================================================
# CI workflow for AlignedVector component
#
# Directory structure:
#   Headers:    FAT_P/FAT_P/fat_p/AlignedVector.h
#   Tests:      FAT_P/FAT_P/tests/test_AlignedVector.cpp
#   Benchmarks: FAT_P/FAT_P/benchmarks/benchmark_AlignedVector.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: AlignedVector CI

on:
  push:
    branches: [main, master]
    paths:
      - 'FAT_P/FAT_P/fat_p/AlignedVector.h'
      - 'FAT_P/FAT_P/tests/test_AlignedVector.cpp'
      - 'FAT_P/FAT_P/benchmarks/benchmark_AlignedVector.cpp'
      - '.github/workflows/aligned_vector.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'FAT_P/FAT_P/fat_p/AlignedVector.h'
      - 'FAT_P/FAT_P/tests/test_AlignedVector.cpp'
      - 'FAT_P/FAT_P/benchmarks/benchmark_AlignedVector.cpp'
  schedule:
    - cron: '0 2 * * 0'  # Weekly benchmarks
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run benchmarks'
        required: false
        default: 'false'
        type: boolean

env:
  INCLUDE_DIR: FAT_P/FAT_P/fat_p
  TEST_SRC: FAT_P/FAT_P/tests/test_AlignedVector.cpp
  BENCH_SRC: FAT_P/FAT_P/benchmarks/benchmark_AlignedVector.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11
            std: 17
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_AlignedVector.cpp -o test_av

      - name: Run tests
        run: ./test_av

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_AlignedVector.cpp -o test_av

      - name: Run tests
        run: ./test_av

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        run: |
          cl /std:c++${{ matrix.std }} /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /I.\FAT_P\FAT_P\fat_p FAT_P\FAT_P\tests\test_AlignedVector.cpp /Fe:test_av.exe

      - name: Run tests
        run: .\test_av.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_AlignedVector.cpp -o test_av

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_av

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_AlignedVector.cpp -o test_av

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_av

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_AlignedVector.cpp -o test_av

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_av

  # ===========================================================================
  # Header Self-Containment (Fat-P §6.2)
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test AlignedVector.h compiles standalone
        run: |
          echo '#include "AlignedVector.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./FAT_P/FAT_P/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ Header is self-contained"

      - name: Test include order independence
        run: |
          # AlignedVector first
          cat > test1.cpp << 'EOF'
          #include "AlignedVector.h"
          #include <vector>
          #include <algorithm>
          int main() { fat_p::AlignedVector<int> v; return 0; }
          EOF
          
          # AlignedVector last
          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "AlignedVector.h"
          int main() { fat_p::AlignedVector<int> v; return 0; }
          EOF
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I./FAT_P/FAT_P/fat_p -c test1.cpp -o /dev/null
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I./FAT_P/FAT_P/fat_p -c test2.cpp -o /dev/null
          
          echo "✓ Include order independent"

  # ===========================================================================
  # Benchmarks (Weekly/Manual)
  # ===========================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark
        run: |
          g++ -std=c++17 -O3 -DNDEBUG -march=native \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/benchmarks/benchmark_AlignedVector.cpp -o bench_av

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_av 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
