# =============================================================================
# .github/workflows/stringpool-benchmarks.yml
# =============================================================================
# Standalone benchmark workflow for StringPool.
# Manual dispatch only.
#
# Competitor matrix:
#   All platforms:
#     [x] std::unordered_set<string>       (baseline)
#     [x] std::unordered_map<string>       (manual intern baseline)
#     [x] boost::flyweight<string>         (header-only, shared cache)
# =============================================================================

name: StringPool Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '100000'
        type: string

env:
  BENCH_SRC: components/StringPool/benchmarks/benchmark_StringPool.cpp

jobs:
  # ===========================================================================
  # Ensure shared benchmark dependency caches exist
  # ===========================================================================
  ensure-deps:
    name: Ensure Benchmark Dependencies
    uses: ./.github/workflows/build-benchmark-deps.yml
    secrets: inherit

  benchmarks-gcc:
    needs: ensure-deps
    name: GCC-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13, 14]
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}
      - name: Restore compiled deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-compiled
          key: fatp-bench-deps-gcc-v1
      - name: Verify caches restored
        run: |
          if [ ! -d "$HOME/thirdparty-compiled/boost" ]; then
            echo "::error::Shared caches missing. Dispatch build-benchmark-deps.yml first."
            exit 1
          fi
      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty-compiled/boost/include \
            ${{ env.BENCH_SRC }} \
            -o bench_stringpool -pthread
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp20.csv
        run: ./bench_stringpool 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StringPool-gcc${{ matrix.version }}
          path: |
            results_gcc${{ matrix.version }}_cpp20.csv
            benchmark_gcc${{ matrix.version }}_cpp20.log

  benchmarks-clang:
    needs: ensure-deps
    name: Clang-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: |
          sudo apt-get install -y clang-${{ matrix.version }}
      - name: Restore compiled deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-compiled
          key: fatp-bench-deps-clang-v1
      - name: Verify caches restored
        run: |
          if [ ! -d "$HOME/thirdparty-compiled/boost" ]; then
            echo "::error::Shared caches missing. Dispatch build-benchmark-deps.yml first."
            exit 1
          fi
      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty-compiled/boost/include \
            ${{ env.BENCH_SRC }} \
            -o bench_stringpool -pthread \
            -lstdc++
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp20.csv
        run: ./bench_stringpool 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StringPool-clang${{ matrix.version }}
          path: |
            results_clang${{ matrix.version }}_cpp20.csv
            benchmark_clang${{ matrix.version }}_cpp20.log

  benchmarks-msvc:
    needs: ensure-deps
    name: MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: fatp-bench-deps-vcpkg-v1
      - name: Verify cache restored
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ github.workspace }}\vcpkg_cache")) {
            Write-Error "vcpkg cache not found. Run build-benchmark-deps.yml first."
            exit 1
          }
      - name: Install competitors via vcpkg (from cache)
        shell: cmd
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-release
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
        run: |
          vcpkg install boost-flyweight:x64-windows-release
      - name: Build benchmark
        shell: pwsh
        run: |
          $vcpkgInc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-release\include"
          cl /nologo /std:c++20 /O2 /MD /DNDEBUG /EHsc /permissive- /utf-8 `
            /Zc:preprocessor /wd4324 /wd4244 /wd4267 `
            /D_CRT_SECURE_NO_WARNINGS `
            /I.\include\fat_p `
            /I"$vcpkgInc" `
            ${{ env.BENCH_SRC }} `
            /Fe:bench_stringpool.exe `
            /link advapi32.lib
      - name: Run benchmark
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp20.csv
        run: .\bench_stringpool.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StringPool-msvc
          path: |
            results_msvc_cpp20.csv
            benchmark_msvc_cpp20.log

  benchmark-summary:
    name: StringPool Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: bench-StringPool-*
          path: all-benchmarks
          merge-multiple: false
      - name: Aggregate results
        run: |
          echo "# StringPool Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Status |" >> summary.md
          echo "|----------|--------|" >> summary.md
          for dir in all-benchmarks/bench-StringPool-*/; do
            name=$(basename "$dir" | sed 's/^bench-StringPool-//')
            if ls "$dir"/*.log 1>/dev/null 2>&1; then echo "| $name | [PASS] |" >> summary.md; else echo "| $name | [FAIL] |" >> summary.md; fi
          done
          echo "" >> summary.md; echo "## Individual Results" >> summary.md
          for dir in all-benchmarks/bench-StringPool-*/; do
            name=$(basename "$dir" | sed 's/^bench-StringPool-//'); echo "" >> summary.md; echo "### $name" >> summary.md
            for log in "$dir"/*.log; do [ -f "$log" ] && echo '```' >> summary.md && tail -80 "$log" >> summary.md && echo '```' >> summary.md; done
          done
          cat summary.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StringPool-summary
          path: |
            all-benchmarks/
            summary.md
