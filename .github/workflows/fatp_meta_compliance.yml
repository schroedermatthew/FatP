name: FATP_META Compliance

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        default: "3.12"
      os_matrix:
        description: "Comma-separated runner OS list"
        required: false
        default: "ubuntu-latest,windows-latest"

permissions:
  contents: read

jobs:
  meta_inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: meta inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["{0}"]', join(split((github.event.inputs.os_matrix || 'ubuntu-latest,windows-latest'), ','), '","'))) }}
        python: [${{ github.event.inputs.python_version || '3.12' }}]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run FATP_META inventory (unix)
        if: runner.os != 'Windows'
        run: |
          python tools/fatp_meta_inventory.py             --json-out meta_report.json             --print-missing             --print-path-mismatch             --print-schema-fail             --print-layout-fail             --print-version-bad             --fail-on-issues

      - name: Run FATP_META inventory (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/fatp_meta_inventory.py `
            --json-out meta_report.json `
            --print-missing `
            --print-path-mismatch `
            --print-schema-fail `
            --print-layout-fail `
            --print-version-bad `
            --fail-on-issues

      - name: Upload meta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta_report_${{ matrix.os }}
          path: meta_report.json
