name: FATP_META Compliance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta_inventory:

    name: meta inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run FATP_META inventory (unix)
        if: runner.os != 'Windows'
        run: |
          python tools/fatp_meta_inventory.py \
            --json-out meta_report.json \
            --print-missing \
            --print-path-mismatch \
            --print-schema-fail \
            --print-layout-fail \
            --print-version-bad \
            --fail-on-issues

      - name: Run FATP_META inventory (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/fatp_meta_inventory.py `
            --json-out meta_report.json `
            --print-missing `
            --print-path-mismatch `
            --print-schema-fail `
            --print-layout-fail `
            --print-version-bad `
            --fail-on-issues

      - name: Upload meta report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: meta_report_${{ matrix.os }}
          path: meta_report.json
