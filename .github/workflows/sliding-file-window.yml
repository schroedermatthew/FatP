# =============================================================================
# .github/workflows/sliding-file-window.yml
# =============================================================================
# CI workflow for SlidingFileWindow component
#
# C++20 primary build. C++17 compatibility verified project-wide via ci_core17.yml.
#
# Directory structure:
#   Headers:    include/fat_p/SlidingFileWindow.h
#   Tests:      components/SlidingFileWindow/tests/test_SlidingFileWindow.cpp
# =============================================================================

name: SlidingFileWindow CI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
env:
  HEADER: SlidingFileWindow.h
  TEST_SRC: components/SlidingFileWindow/tests/test_SlidingFileWindow.cpp

jobs:
  # ===========================================================================
  # Linux GCC Build (C++20)
  # ===========================================================================
  linux-gcc:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux GCC-13 C++20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: Build tests
        run: |
          g++-13 -std=c++20 \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Linux Clang Build (C++20)
  # ===========================================================================
  linux-clang:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux Clang-16 C++20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Build tests
        run: |
          clang++-16 -std=c++20 \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_bin

  sanitizer-ubsan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_bin

  # ===========================================================================
  # Header Self-Containment (C++20)
  # ===========================================================================
  header-check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test header compiles standalone
        run: |
          echo '#include "${{ env.HEADER }}"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ Header is self-contained"

  # ===========================================================================
  # Strict Warnings (C++20)
  # ===========================================================================
  strict-warnings:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "✓ No warnings"

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (always()) }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
