# =============================================================================
# .github/workflows/stable-hash-map.yml
# =============================================================================
# CI workflow for StableHashMap component
#
# Directory structure:
#   Headers:    include/fat_p/StableHashMap.h
#   Tests:      components/StableHashMap/tests/test_StableHashMap.cpp
#   Benchmarks: components/StableHashMap/benchmarks/benchmark_FatPHashMap.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: StableHashMap CI

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run benchmarks'
        type: boolean
        default: false
env:
  INCLUDE_DIR: include/fat_p
  TEST_SRC: components/StableHashMap/tests/test_StableHashMap.cpp
  BENCH_SRC: components/StableHashMap/benchmarks/benchmark_FatPHashMap.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 13
            std: 23
          - version: 14
            std: 20
          - version: 14
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_shm

      - name: Run tests
        run: ./test_shm

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 15
            std: 20
          - version: 16
            std: 20
          - version: 16
            std: 23
          - version: 17
            std: 20
          - version: 17
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_shm

      - name: Run tests
        run: ./test_shm

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\StableHashMap\tests\test_StableHashMap.cpp /Fe:test_shm.exe /link advapi32.lib

      - name: Run tests
        run: .\test_shm.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_shm

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_shm

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_shm

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_shm

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_shm

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_shm

  # ===========================================================================
  # Header Self-Containment (Fat-P §6.2)
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test StableHashMap.h compiles standalone
        run: |
          echo '#include "StableHashMap.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ Header is self-contained"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++ -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "✓ No warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Weekly/Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++23
    runs-on: ubuntu-latest
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        version: [13, 14]

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev \
            libabsl-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/unordered)"
          echo "  - Abseil (absl/container)"

      - name: Cache header-only libraries
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: ~/thirdparty
          key: hashmap-thirdparty-${{ runner.os }}-v1

      - name: Install header-only libraries
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/thirdparty
          git clone --depth 1 https://github.com/Tessil/robin-map.git $HOME/thirdparty/robin-map
          git clone --depth 1 https://github.com/martinus/unordered_dense.git $HOME/thirdparty/unordered_dense

      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++23 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty/robin-map/include \
            -I$HOME/thirdparty/unordered_dense/include \
            ${{ env.BENCH_SRC }} -o bench_shm \
            -labsl_hash -labsl_raw_hash_set -labsl_hashtablez_sampler \
            -labsl_synchronization -labsl_stacktrace -labsl_symbolize \
            -labsl_base -labsl_spinlock_wait -labsl_malloc_internal \
            -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp23.csv
        run: ./bench_shm 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp23
          path: |
            results_gcc${{ matrix.version }}_cpp23.csv
            benchmark_gcc${{ matrix.version }}_cpp23.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Weekly/Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++23
    runs-on: ubuntu-22.04
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev \
            libabsl-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/unordered)"
          echo "  - Abseil (absl/container)"

      - name: Cache header-only libraries
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: ~/thirdparty
          key: hashmap-thirdparty-${{ runner.os }}-v1

      - name: Install header-only libraries
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/thirdparty
          git clone --depth 1 https://github.com/Tessil/robin-map.git $HOME/thirdparty/robin-map
          git clone --depth 1 https://github.com/martinus/unordered_dense.git $HOME/thirdparty/unordered_dense

      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++23 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty/robin-map/include \
            -I$HOME/thirdparty/unordered_dense/include \
            ${{ env.BENCH_SRC }} -o bench_shm \
            -labsl_hash -labsl_raw_hash_set -labsl_hashtablez_sampler \
            -labsl_synchronization -labsl_stacktrace -labsl_symbolize \
            -labsl_base -labsl_spinlock_wait -labsl_malloc_internal \
            -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp23.csv
        run: ./bench_shm 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clang${{ matrix.version }}-cpp23
          path: |
            results_clang${{ matrix.version }}_cpp23.csv
            benchmark_clang${{ matrix.version }}_cpp23.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Weekly/Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++23
    runs-on: windows-latest
    if: ${{ inputs.run_benchmarks }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-hashmap-${{ runner.os }}-v1

      - name: Install competitor libraries via vcpkg
        run: |
          vcpkg install abseil:x64-windows
          vcpkg install boost-unordered:x64-windows
          
          echo "Installed competitor libraries via vcpkg"

      - name: Cache header-only libraries
        id: cache-headeronly
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: hashmap-headeronly-${{ runner.os }}-v1

      - name: Install header-only libraries
        if: steps.cache-headeronly.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path thirdparty
          git clone --depth 1 https://github.com/Tessil/robin-map.git thirdparty/robin-map
          git clone --depth 1 https://github.com/martinus/unordered_dense.git thirdparty/unordered_dense

      - name: Build benchmark
        shell: pwsh
        run: |
          cl /nologo /std:c++latest /O2 /DNDEBUG /EHsc /permissive- `
            /I.\include\fat_p `
            /I.\thirdparty\robin-map\include `
            /I.\thirdparty\unordered_dense\include `
            /I"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" `
            components\StableHashMap\benchmarks\benchmark_FatPHashMap.cpp `
            /Fe:bench_shm.exe `
            /link /LIBPATH:"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib" advapi32.lib

      - name: Run benchmarks
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp23.csv
        run: |
          .\bench_shm.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-msvc-cpp23
          path: |
            results_msvc_cpp23.csv
            benchmark_msvc_cpp23.log

  # ===========================================================================
  # Benchmark Summary (Aggregates all benchmark artifacts)
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.run_benchmarks }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary - StableHashMap" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Standard | Status |" >> summary.md
          echo "|----------|----------|--------|" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | ✓ |" >> summary.md
            else
              echo "| $name | ✗ |" >> summary.md
            fi
          done
          
          echo "" >> summary.md
          echo "## Individual Results" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir"/*.log ]; then
              echo '```' >> summary.md
              tail -50 "$dir"/*.log >> summary.md
              echo '```' >> summary.md
            fi
          done
          
          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
