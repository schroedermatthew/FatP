# =============================================================================
# .github/workflows/strongid-benchmarks.yml
# =============================================================================
# Standalone benchmark workflow for StrongId.
# Manual dispatch only.
#
# Competitor matrix:
#   All platforms:
#     [x] NamedType                       (vendored in ThirdParty/)
#     [x] rollbear::strong_type           (vendored in ThirdParty/)
#     [x] boost::strong_typedef           (header-only, shared cache)
# =============================================================================

name: StrongId Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '100000'
        type: string

env:
  BENCH_SRC: components/StrongId/benchmarks/benchmark_StrongId.cpp

jobs:
  # ===========================================================================
  # Ensure shared benchmark dependency caches exist
  # ===========================================================================
  benchmarks-gcc:
    name: GCC-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13, 14]
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}
      - name: Restore compiled deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-compiled
          key: fatp-bench-deps-gcc-v1
          restore-keys: fatp-bench-deps-gcc-v1-
      - name: Restore header-only deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-headers
          key: fatp-bench-deps-headeronly-v1
          restore-keys: fatp-bench-deps-headeronly-v1-
      - name: Verify caches restored
        run: |
          if [ ! -d "$HOME/thirdparty-compiled/boost" ]; then
            echo "::error::Shared benchmark dependency caches could not be restored. Re-run the workflow or dispatch build-benchmark-deps.yml with force_rebuild=true."
            exit 1
          fi
      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I./ThirdParty \
            -I$HOME/thirdparty-compiled/boost/include \
            -I$HOME/thirdparty-headers/type_safe \
            ${{ env.BENCH_SRC }} \
            -o bench_strongid -pthread
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp20.csv
        run: ./bench_strongid 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StrongId-gcc${{ matrix.version }}
          path: |
            results_gcc${{ matrix.version }}_cpp20.csv
            benchmark_gcc${{ matrix.version }}_cpp20.log

  benchmarks-clang:
    name: Clang-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: |
          sudo apt-get install -y clang-${{ matrix.version }}
      - name: Restore compiled deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-compiled
          key: fatp-bench-deps-clang-v1
          restore-keys: fatp-bench-deps-clang-v1-
      - name: Restore header-only deps
        uses: actions/cache/restore@v5
        with:
          path: ~/thirdparty-headers
          key: fatp-bench-deps-headeronly-v1
          restore-keys: fatp-bench-deps-headeronly-v1-
      - name: Verify caches restored
        run: |
          if [ ! -d "$HOME/thirdparty-compiled/boost" ]; then
            echo "::error::Shared benchmark dependency caches could not be restored. Re-run the workflow or dispatch build-benchmark-deps.yml with force_rebuild=true."
            exit 1
          fi
      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I./ThirdParty \
            -I$HOME/thirdparty-compiled/boost/include \
            -I$HOME/thirdparty-headers/type_safe \
            ${{ env.BENCH_SRC }} \
            -o bench_strongid -pthread \
            -lstdc++
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp20.csv
        run: ./bench_strongid 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StrongId-clang${{ matrix.version }}
          path: |
            results_clang${{ matrix.version }}_cpp20.csv
            benchmark_clang${{ matrix.version }}_cpp20.log

  benchmarks-msvc:
    name: MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: fatp-bench-deps-vcpkg-v1
          restore-keys: fatp-bench-deps-vcpkg-v1-
      - name: Verify cache restored
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ github.workspace }}\vcpkg_cache")) {
            Write-Error "vcpkg benchmark dependency cache could not be restored. Re-run the workflow or dispatch build-benchmark-deps.yml with force_rebuild=true."
            exit 1
          }
      - name: Install competitors via vcpkg (from cache)
        shell: cmd
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-release
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
        run: |
          vcpkg install boost-serialization:x64-windows-release
      - name: Build benchmark
        shell: pwsh
        run: |
          $vcpkgInc = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-release\include"
          cl /nologo /std:c++20 /O2 /MD /DNDEBUG /EHsc /permissive- /utf-8 `
            /wd4324 /wd4244 /wd4267 `
            /D_CRT_SECURE_NO_WARNINGS `
            /I.\include\fat_p `
            /I.\ThirdParty `
            /I"$vcpkgInc" `
            ${{ env.BENCH_SRC }} `
            /Fe:bench_strongid.exe `
            /link advapi32.lib
      - name: Run benchmark
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp20.csv
        run: .\bench_strongid.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StrongId-msvc
          path: |
            results_msvc_cpp20.csv
            benchmark_msvc_cpp20.log

  benchmark-summary:
    name: StrongId Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: bench-StrongId-*
          path: all-benchmarks
          merge-multiple: false
      - name: Aggregate results
        run: |
          echo "# StrongId Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Status |" >> summary.md
          echo "|----------|--------|" >> summary.md
          for dir in all-benchmarks/bench-StrongId-*/; do
            name=$(basename "$dir" | sed 's/^bench-StrongId-//')
            if ls "$dir"/*.log 1>/dev/null 2>&1; then echo "| $name | [PASS] |" >> summary.md; else echo "| $name | [FAIL] |" >> summary.md; fi
          done
          echo "" >> summary.md; echo "## Individual Results" >> summary.md
          for dir in all-benchmarks/bench-StrongId-*/; do
            name=$(basename "$dir" | sed 's/^bench-StrongId-//'); echo "" >> summary.md; echo "### $name" >> summary.md
            for log in "$dir"/*.log; do [ -f "$log" ] && echo '```' >> summary.md && tail -80 "$log" >> summary.md && echo '```' >> summary.md; done
          done
          cat summary.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        with:
          name: bench-StrongId-summary
          path: |
            all-benchmarks/
            summary.md
