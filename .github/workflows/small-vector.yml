# =============================================================================
# .github/workflows/small-vector.yml
# =============================================================================
# CI workflow for SmallVector component
#
# C++20 primary build. C++17 compatibility verified project-wide via ci_core17.yml.
#
# Directory structure:
#   Headers:    include/fat_p/SmallVector.h
#   Tests:      components/SmallVector/tests/test_SmallVector.cpp
#   Benchmarks: components/SmallVector/benchmarks/benchmark_SmallVector.cpp
#
# Third-party libraries for benchmarks:
#   - boost::container::small_vector (libboost-container-dev)
#   - llvm::SmallVector (llvm-dev)
# =============================================================================

name: SmallVector CI

on:
  workflow_dispatch:
env:
  HEADER: SmallVector.h
  TEST_SRC: components/SmallVector/tests/test_SmallVector.cpp

jobs:
  # ===========================================================================
  # Linux GCC Build (C++20)
  # ===========================================================================
  linux-gcc:

    name: Linux GCC-13 C++20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: Build tests
        run: |
          g++-13 -std=c++20 \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Linux Clang Build (C++20)
  # ===========================================================================
  linux-clang:

    name: Linux Clang-16 C++20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Build tests
        run: |
          clang++-16 -std=c++20 \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Windows MSVC Build (C++20)
  # ===========================================================================
  windows-msvc:

    name: Windows MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        run: |
          cl /std:c++20 /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\FAT_P\FAT_P\fat_p FAT_P\FAT_P\tests\test_SmallVector.cpp /Fe:test_bin.exe /link advapi32.lib

      - name: Run tests
        run: .\test_bin.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:

    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_bin

  sanitizer-ubsan:

    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_bin

  # ===========================================================================
  # Header Self-Containment (C++20)
  # ===========================================================================
  header-check:

    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test header compiles standalone
        run: |
          echo '#include "${{ env.HEADER }}"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ Header is self-contained"

  # ===========================================================================
  # Strict Warnings (C++20)
  # ===========================================================================
  strict-warnings:

    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "✓ No warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.run_benchmarks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20
          - version: 13
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }} libboost-container-dev llvm-18-dev

      - name: Build benchmarks
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            components/SmallVector/benchmarks/benchmark_SmallVector.cpp \
            -o bench_smallvector

      - name: Run benchmarks
        env:
          FATP_BENCH_BATCHES: 15
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_smallvector 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    if: ${{ github.event.inputs.run_benchmarks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20
          - version: 17
            std: 20
          - version: 17
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and build tools
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}
          sudo apt-get install -y libboost-container-dev llvm-18-dev

      - name: Build benchmarks
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} -O3 -DNDEBUG -march=native \
            -Wno-gnu-zero-variadic-macro-arguments \
            -I./include/fat_p \
            components/SmallVector/benchmarks/benchmark_SmallVector.cpp \
            -o bench_smallvector

      - name: Run benchmarks
        env:
          FATP_BENCH_BATCHES: 15
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_smallvector 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clang${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    if: ${{ github.event.inputs.run_benchmarks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20, 23]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
          key: vcpkg-smallvector-${{ runner.os }}-v1

      - name: Install competitor libraries via vcpkg
        run: |
          vcpkg install boost-container:x64-windows
          echo "Installed competitor libraries via vcpkg"

      - name: Build benchmarks
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          
          cl /nologo $stdFlag /O2 /DNDEBUG /EHsc /permissive- `
            /I.\FAT_P\FAT_P\fat_p `
            /I"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" `
            FAT_P\FAT_P\benchmarks\benchmark_SmallVector.cpp `
            /Fe:bench_smallvector.exe `
            /link /LIBPATH:"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib" advapi32.lib

      - name: Run benchmarks
        shell: pwsh
        env:
          FATP_BENCH_BATCHES: "15"
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp${{ matrix.std }}.csv
        run: |
          .\bench_smallvector.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-msvc-cpp${{ matrix.std }}
          path: |
            results_msvc_cpp${{ matrix.std }}.csv
            benchmark_msvc_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmark Summary
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary - SmallVector" > summary.md
          echo "" >> summary.md
          echo "| Configuration | Status |" >> summary.md
          echo "|---------------|--------|" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | ✓ |" >> summary.md
            else
              echo "| $name | ✗ |" >> summary.md
            fi
          done
          
          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
