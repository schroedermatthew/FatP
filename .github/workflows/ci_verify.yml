# =============================================================================
# .github/workflows/ci_verify.yml
# =============================================================================
# Verifies FATP_META.layer fields match actual #include dependencies and no forbidden deps
# Per Fat-P Guidelines §2.2: Layer mismatches are Critical violations
# Per Fat-P Guidelines §1.6: No third-party libraries
# =============================================================================

name: Layer & Dependency Verification

on:
  workflow_dispatch:
jobs:
  # ===========================================================================
  # Layer Tag Verification
  # ===========================================================================
  verify-layers:

    name: Verify Layer Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FATP_META.layer fields present
        run: |
          echo "Checking all headers have FATP_META.layer fields..."
          
          found=0
          missing=0
          for header in include/fat_p/*.h; do
            if [ ! -f "$header" ]; then
              continue
            fi
            found=$((found + 1))
            if ! grep -qP 'layer:\s*\w+' "$header"; then
              echo "[FAIL] Missing FATP_META.layer: $header"
              missing=$((missing + 1))
            fi
          done

          if [ $found -eq 0 ]; then
            echo "[FAIL] No headers found under include/fat_p/*.h"
            exit 1
          fi
          
          if [ $missing -gt 0 ]; then
            echo ""
            echo "[FAIL] $missing headers missing FATP_META.layer fields"
            echo "Add FATP_META block with layer field per Guidelines §2.2"
            exit 1
          fi
          
          echo "[PASS] All headers have FATP_META.layer fields"

      - name: Verify layer dependencies
        run: |
          echo "Verifying layer dependency order..."
          
          # Layer order (lower = can be included by higher)
          # Foundation(0) < Containers(1) < Concurrency(2) < Domain(3) < Integration(4) < Testing(5)
          
          get_layer_level() {
            case "$1" in
              Foundation|CoreUtility|Enforcement) echo 0 ;;
              Containers|Infrastructure) echo 1 ;;
              Concurrency) echo 2 ;;
              Domain|Policy|Application|Serialization) echo 3 ;;
              Integration) echo 4 ;;
              Testing) echo 5 ;;
              *) echo 99 ;;
            esac
          }
          
          violations=0
          found=0
          
          for header in include/fat_p/*.h; do
            if [ ! -f "$header" ]; then
              continue
            fi
            found=$((found + 1))
            
            basename=$(basename "$header")
            
            # Extract FATP_META.layer field
            layer=$(grep -oP 'layer:\s*\K\w+' "$header" 2>/dev/null | head -1 || echo "MISSING")
            
            if [ "$layer" = "MISSING" ]; then
              continue  # Already reported above
            fi
            
            layer_level=$(get_layer_level "$layer")
            
            if [ "$layer_level" = "99" ]; then
              echo "[FAIL] $basename: Unknown layer '$layer'"
              violations=$((violations + 1))
              continue
            fi
            
            # Check internal includes
            while IFS= read -r inc; do
              inc_file=$(echo "$inc" | grep -oP '"[^"]+"' | tr -d '"')
              # Normalize includes like "fat_p/Foo.h" to "Foo.h"
              inc_file=$(basename "$inc_file")
              inc_path="include/fat_p/$inc_file"
              
              if [ ! -f "$inc_path" ]; then
                continue  # External include
              fi
              
              inc_layer=$(grep -oP 'layer:\s*\K\w+' "$inc_path" 2>/dev/null | head -1 || echo "MISSING")
              inc_level=$(get_layer_level "$inc_layer")
              
              if [ "$inc_level" -gt "$layer_level" ]; then
                echo "[FAIL] LAYER VIOLATION: $basename (layer $layer, level $layer_level)"
                echo "   includes $inc_file (layer $inc_layer, level $inc_level)"
                violations=$((violations + 1))
              fi
            done < <(grep -E '^[[:space:]]*#include[[:space:]]*"' "$header" || true)
          done

          if [ $found -eq 0 ]; then
            echo "[FAIL] No headers found under include/fat_p/*.h"
            exit 1
          fi
          
          if [ $violations -gt 0 ]; then
            echo ""
            echo "[FAIL] $violations layer violations found"
            echo "Components may only include headers from lower or equal layers"
            exit 1
          fi
          
          echo "[PASS] All layer dependencies valid"

  # ===========================================================================
  # Forbidden Dependency Scan
  # ===========================================================================
  scan-forbidden-deps:

    name: Scan Forbidden Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden includes
        run: |
          echo "Scanning for forbidden third-party includes..."
          echo "Per Guidelines §1.6: No third-party libraries"
          echo ""
          
          violations=0
          
          # Check for Boost
          matches=$(grep -rn '#include.*[<"]boost/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: Boost"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for Abseil
          matches=$(grep -rn '#include.*[<"]absl/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: Abseil"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for fmt
          matches=$(grep -rn '#include.*[<"]fmt/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: fmt"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for Eigen
          matches=$(grep -rn '#include.*[<"]Eigen/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: Eigen"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for nlohmann/json
          matches=$(grep -rn '#include.*[<"]nlohmann/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: nlohmann/json"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for spdlog
          matches=$(grep -rn '#include.*[<"]spdlog/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: spdlog"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          # Check for catch2/gtest/doctest (in main headers, not tests)
          matches=$(grep -rn '#include.*[<"]catch2/\|#include.*[<"]gtest/\|#include.*[<"]doctest/' include/fat_p/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "[FAIL] Forbidden: Test frameworks in library headers"
            echo "$matches"
            violations=$((violations + 1))
          fi
          
          if [ $violations -gt 0 ]; then
            echo ""
            echo "[FAIL] $violations forbidden dependency violations found"
            echo "Fat-P must not depend on third-party libraries"
            exit 1
          fi
          
          echo "[PASS] No forbidden dependencies found"

  # ===========================================================================
  # Gate Job
  # ===========================================================================
  verify-success:
    name: Verification Success
    needs: [verify-layers, scan-forbidden-deps]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.verify-layers.result }}" != "success" ]]; then
            echo "[FAIL] Layer verification failed"
            exit 1
          fi
          if [[ "${{ needs.scan-forbidden-deps.result }}" != "success" ]]; then
            echo "[FAIL] Forbidden dependency scan failed"
            exit 1
          fi
          echo "[PASS] All verification checks passed"
