# =============================================================================
# .github/workflows/skeleton-benchmarks.yml
# =============================================================================
# Standalone benchmark workflow for Skeleton.
# Manual dispatch only.
#
# Competitors:
#   All platforms:
#     [x] fat_p::Skeleton                          (primary)
#     [x] std::unordered_map                       (find baseline, stdlib)
#     [x] std::vector linear scan                  (query baseline, stdlib)
#
# No external dependencies required.
# =============================================================================

name: Skeleton Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '100000'
        type: string

env:
  BENCH_SRC: components/Skeleton/benchmarks/benchmark_Skeleton.cpp

jobs:
  benchmarks-gcc:
    name: GCC-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13, 14]
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}
      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} \
            -o bench_skeleton -pthread
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp20.csv
        run: ./bench_skeleton 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-Skeleton-gcc${{ matrix.version }}
          path: |
            results_gcc${{ matrix.version }}_cpp20.csv
            benchmark_gcc${{ matrix.version }}_cpp20.log

  benchmarks-clang:
    name: Clang-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-${{ matrix.version }}
      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} \
            -o bench_skeleton -pthread \
            -lstdc++
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp20.csv
        run: ./bench_skeleton 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-Skeleton-clang${{ matrix.version }}
          path: |
            results_clang${{ matrix.version }}_cpp20.csv
            benchmark_clang${{ matrix.version }}_cpp20.log

  benchmarks-msvc:
    name: MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build benchmark
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /O2 /MD /DNDEBUG /EHsc /permissive- /utf-8 `
            /Zc:preprocessor /wd4324 /wd4244 /wd4267 `
            /D_CRT_SECURE_NO_WARNINGS `
            /I.\include\fat_p `
            ${{ env.BENCH_SRC }} `
            /Fe:bench_skeleton.exe `
            /link advapi32.lib
      - name: Run benchmark
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp20.csv
        run: .\bench_skeleton.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp20.log
      - uses: actions/upload-artifact@v5
        with:
          name: bench-Skeleton-msvc
          path: |
            results_msvc_cpp20.csv
            benchmark_msvc_cpp20.log

  benchmark-summary:
    name: Skeleton Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: bench-Skeleton-*
          path: all-benchmarks
          merge-multiple: false
      - name: Aggregate results
        run: |
          echo "# Skeleton Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Status |" >> summary.md
          echo "|----------|--------|" >> summary.md
          for dir in all-benchmarks/bench-Skeleton-*/; do
            name=$(basename "$dir" | sed 's/^bench-Skeleton-//')
            if ls "$dir"/*.log 1>/dev/null 2>&1; then echo "| $name | [PASS] |" >> summary.md; else echo "| $name | [FAIL] |" >> summary.md; fi
          done
          echo "" >> summary.md
          echo "## Individual Results" >> summary.md
          for dir in all-benchmarks/bench-Skeleton-*/; do
            name=$(basename "$dir" | sed 's/^bench-Skeleton-//'); echo "" >> summary.md; echo "### $name" >> summary.md
            for log in "$dir"/*.log; do [ -f "$log" ] && echo '```' >> summary.md && tail -80 "$log" >> summary.md && echo '```' >> summary.md; done
          done
          cat summary.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v5
        with:
          name: bench-Skeleton-summary
          path: |
            all-benchmarks/
            summary.md
