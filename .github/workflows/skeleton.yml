# =============================================================================
# .github/workflows/skeleton.yml
# =============================================================================
# CI workflow for the Skeleton component.
#
# Directory structure:
#   Headers:    include/fat_p/Skeleton.h
#               include/fat_p/SkeletonFwd.h
#               include/fat_p/OwnerSkeleton.h
#   Tests:      components/Skeleton/tests/test_Skeleton.cpp
#               components/Skeleton/tests/test_OwnerSkeleton.cpp
#   Benchmarks: components/Skeleton/benchmarks/benchmark_Skeleton.cpp
#
# Benchmarks are run separately via skeleton-benchmarks.yml
# (manual dispatch only).
# =============================================================================

name: Skeleton CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/fat_p/Skeleton.h'
      - 'include/fat_p/SkeletonFwd.h'
      - 'include/fat_p/OwnerSkeleton.h'
      - 'components/Skeleton/tests/test_Skeleton.cpp'
      - 'components/Skeleton/tests/test_OwnerSkeleton.cpp'
      - 'components/Skeleton/benchmarks/benchmark_Skeleton.cpp'
      - '.github/workflows/skeleton.yml'
  pull_request:
    paths:
      - 'include/fat_p/Skeleton.h'
      - 'include/fat_p/SkeletonFwd.h'
      - 'include/fat_p/OwnerSkeleton.h'
      - 'components/Skeleton/tests/test_Skeleton.cpp'
      - 'components/Skeleton/tests/test_OwnerSkeleton.cpp'
      - 'components/Skeleton/benchmarks/benchmark_Skeleton.cpp'
      - '.github/workflows/skeleton.yml'

env:
  TEST_SRC:          components/Skeleton/tests/test_Skeleton.cpp
  OWNER_TEST_SRC:    components/Skeleton/tests/test_OwnerSkeleton.cpp
  BENCH_SRC:         components/Skeleton/benchmarks/benchmark_Skeleton.cpp
  HDR_SC_SRC:        components/Skeleton/tests/test_Skeleton_HeaderSelfContained.cpp
  FWD_SC_SRC:        components/Skeleton/tests/test_SkeletonFwd_HeaderSelfContained.cpp
  OWNER_HDR_SC_SRC:  components/Skeleton/tests/test_OwnerSkeleton_HeaderSelfContained.cpp
  CF_DIR:            components/Skeleton/tests/compile_fail

jobs:

  # ===========================================================================
  # Linux GCC Builds (C++20: GCC 12, GCC 13 | C++23: GCC 14)
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 14
            std: 23
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}
      - name: Build and run test_Skeleton
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_skeleton_bin
          ./test_skeleton_bin
      - name: Build and run test_OwnerSkeleton
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.OWNER_TEST_SRC }} -o test_owner_bin
          ./test_owner_bin

  # ===========================================================================
  # Linux Clang Builds (C++20: Clang 16 | C++23: Clang 17)
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}
      - name: Build and run test_Skeleton
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_skeleton_bin
          ./test_skeleton_bin
      - name: Build and run test_OwnerSkeleton
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.OWNER_TEST_SRC }} -o test_owner_bin
          ./test_owner_bin

  # ===========================================================================
  # Windows MSVC Builds (C++20 and C++23)
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run test_Skeleton
        run: |
          $stdFlag = if (${{ matrix.std }} -eq 23) { "/std:c++latest" } else { "/std:c++${{ matrix.std }}" }
          cl $stdFlag /W4 /WX /wd4324 /EHsc /permissive- /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\Skeleton\tests\test_Skeleton.cpp /Fe:test_skeleton_bin.exe /link advapi32.lib
          .\test_skeleton_bin.exe
      - name: Build and run test_OwnerSkeleton
        run: |
          $stdFlag = if (${{ matrix.std }} -eq 23) { "/std:c++latest" } else { "/std:c++${{ matrix.std }}" }
          cl $stdFlag /W4 /WX /wd4324 /EHsc /permissive- /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\Skeleton\tests\test_OwnerSkeleton.cpp /Fe:test_owner_bin.exe /link advapi32.lib
          .\test_owner_bin.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run test_Skeleton with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_skeleton_bin
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_skeleton_bin
      - name: Build and run test_OwnerSkeleton with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.OWNER_TEST_SRC }} -o test_owner_bin
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_owner_bin

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run test_Skeleton with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_skeleton_bin
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_skeleton_bin
      - name: Build and run test_OwnerSkeleton with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.OWNER_TEST_SRC }} -o test_owner_bin
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_owner_bin

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run test_Skeleton with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_skeleton_bin
          TSAN_OPTIONS=halt_on_error=1 ./test_skeleton_bin
      - name: Build and run test_OwnerSkeleton with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.OWNER_TEST_SRC }} -o test_owner_bin
          TSAN_OPTIONS=halt_on_error=1 ./test_owner_bin

  # ===========================================================================
  # Header Self-Containment
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile test_Skeleton_HeaderSelfContained.cpp
        run: |
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            ${{ env.HDR_SC_SRC }} -o /dev/null
          echo "Skeleton.h: self-contained and idempotent"
      - name: Compile test_SkeletonFwd_HeaderSelfContained.cpp
        run: |
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            ${{ env.FWD_SC_SRC }} -o /dev/null
          echo "SkeletonFwd.h: self-contained and idempotent"
      - name: Compile test_OwnerSkeleton_HeaderSelfContained.cpp
        run: |
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            ${{ env.OWNER_HDR_SC_SRC }} -o /dev/null
          echo "OwnerSkeleton.h: self-contained and idempotent"
      - name: Test Skeleton.h include order independence
        run: |
          cat > test_order1.cpp << 'EOF'
          #include "Skeleton.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test_order2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "Skeleton.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_order1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_order2.cpp -o /dev/null
          echo "Skeleton.h: include order independent"
      - name: Test SkeletonFwd.h include order independence
        run: |
          cat > test_fwd_order1.cpp << 'EOF'
          #include "SkeletonFwd.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test_fwd_order2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "SkeletonFwd.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_fwd_order1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_fwd_order2.cpp -o /dev/null
          echo "SkeletonFwd.h: include order independent"
      - name: Test OwnerSkeleton.h include order independence
        run: |
          cat > test_owner_order1.cpp << 'EOF'
          #include "OwnerSkeleton.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test_owner_order2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "OwnerSkeleton.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_owner_order1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_owner_order2.cpp -o /dev/null
          echo "OwnerSkeleton.h: include order independent"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile test_Skeleton with strict warnings
        run: |
          g++-13 -std=c++20 \
            -Wall -Wextra -Wpedantic \
            -Wconversion -Wsign-conversion \
            -Wshadow -Wformat=2 \
            -Werror \
            -DENABLE_TEST_APPLICATION -I./include/fat_p \
            -o test_strict ${{ env.TEST_SRC }}
          echo "No warnings"
      - name: Compile test_OwnerSkeleton with strict warnings
        run: |
          g++-13 -std=c++20 \
            -Wall -Wextra -Wpedantic \
            -Wconversion -Wsign-conversion \
            -Wshadow -Wformat=2 \
            -Werror \
            -DENABLE_TEST_APPLICATION -I./include/fat_p \
            -o test_owner_strict ${{ env.OWNER_TEST_SRC }}
          echo "No warnings"

  # ===========================================================================
  # Compile-Fail Contracts
  # ===========================================================================
  compile-fail:
    name: Compile-Fail Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject wrong enum type at depth 1
        run: |
          if g++-13 -std=c++20 -I./include/fat_p \
               ${{ env.CF_DIR }}/compile_fail_Skeleton_WrongEnumAtDepth1.cpp \
               -c -o /dev/null 2>&1; then
            echo "FAIL: expected compile failure but compilation succeeded"
            exit 1
          fi
          echo "PASS: correctly rejected wrong enum type at depth 1"
      - name: Reject depth exceeds kMaxDepth
        run: |
          if g++-13 -std=c++20 -I./include/fat_p \
               ${{ env.CF_DIR }}/compile_fail_Skeleton_DepthExceedsMaxDepth.cpp \
               -c -o /dev/null 2>&1; then
            echo "FAIL: expected compile failure but compilation succeeded"
            exit 1
          fi
          echo "PASS: correctly rejected depth exceeding kMaxDepth"
      - name: Reject enum value exceeds byte range (> 255)
        run: |
          if g++-13 -std=c++20 -I./include/fat_p \
               ${{ env.CF_DIR }}/compile_fail_Skeleton_EnumValueExceedsByte.cpp \
               -c -o /dev/null 2>&1; then
            echo "FAIL: expected compile failure but compilation succeeded"
            exit 1
          fi
          echo "PASS: correctly rejected enum value exceeding 255"

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs:
      - linux-gcc
      - linux-clang
      - windows-msvc
      - sanitizer-asan
      - sanitizer-ubsan
      - sanitizer-tsan
      - header-check
      - strict-warnings
      - compile-fail
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}"       != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}"     != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}"    != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}"  != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}"  != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}"    != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail.result }}"    != "success" ]]; then exit 1; fi
          echo "All checks passed"
