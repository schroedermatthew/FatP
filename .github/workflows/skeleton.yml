# =============================================================================
# .github/workflows/skeleton.yml
# =============================================================================
# CI workflow for the Skeleton component.
#
# Directory structure:
#   Headers:    include/fat_p/Skeleton.h
#               include/fat_p/SkeletonFwd.h
#   Tests:      components/Skeleton/tests/test_Skeleton.cpp
#   Benchmarks: components/Skeleton/benchmarks/benchmark_Skeleton.cpp
#
# Benchmarks are run separately via skeleton-benchmarks.yml
# (manual dispatch only).
# =============================================================================

name: Skeleton CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/fat_p/Skeleton.h'
      - 'include/fat_p/SkeletonFwd.h'
      - 'components/Skeleton/tests/test_Skeleton.cpp'
      - 'components/Skeleton/benchmarks/benchmark_Skeleton.cpp'
      - '.github/workflows/skeleton.yml'
  pull_request:
    paths:
      - 'include/fat_p/Skeleton.h'
      - 'include/fat_p/SkeletonFwd.h'
      - 'components/Skeleton/tests/test_Skeleton.cpp'
      - 'components/Skeleton/benchmarks/benchmark_Skeleton.cpp'
      - '.github/workflows/skeleton.yml'

env:
  TEST_SRC: components/Skeleton/tests/test_Skeleton.cpp
  BENCH_SRC: components/Skeleton/benchmarks/benchmark_Skeleton.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds (C++20 / C++23)
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 14
            std: 23
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}
      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin
      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Linux Clang Builds (C++20 / C++23)
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}
      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin
      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Windows MSVC Builds (C++20 / C++23)
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: 20
            flag: "/std:c++20"
          - std: 23
            flag: "/std:c++latest"
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build tests
        shell: cmd
        run: cl ${{ matrix.flag }} /W4 /WX /wd4324 /EHsc /permissive- /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\Skeleton\tests\test_Skeleton.cpp /Fe:test_bin.exe /link advapi32.lib
      - name: Run tests
        run: .\test_bin.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin
      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_bin

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin
      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_bin

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin
      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_bin

  # ===========================================================================
  # Header Self-Containment
  # Both public headers (Skeleton.h and SkeletonFwd.h) are tested independently.
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test Skeleton.h compiles standalone
        run: |
          printf '#include "Skeleton.h"\nint main() { return 0; }\n' > test_include.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          echo "Skeleton.h is self-contained"

      - name: Test SkeletonFwd.h compiles standalone
        run: |
          printf '#include "SkeletonFwd.h"\nint main() { return 0; }\n' > test_fwd_include.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_fwd_include.cpp -o /dev/null
          echo "SkeletonFwd.h is self-contained"

      - name: Test Skeleton.h include order independence
        run: |
          cat > test_order1.cpp << 'EOF'
          #include "Skeleton.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test_order2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "Skeleton.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_order1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_order2.cpp -o /dev/null
          echo "Include order independent"

      - name: Test SkeletonFwd.h include order independence
        run: |
          cat > test_fwd_order1.cpp << 'EOF'
          #include "SkeletonFwd.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test_fwd_order2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "SkeletonFwd.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_fwd_order1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_fwd_order2.cpp -o /dev/null
          echo "SkeletonFwd.h include order independent"

      - name: Test double-include idempotence
        run: |
          printf '#include "Skeleton.h"\n#include "Skeleton.h"\nint main() { return 0; }\n' > test_double.cpp
          printf '#include "SkeletonFwd.h"\n#include "SkeletonFwd.h"\nint main() { return 0; }\n' > test_fwd_double.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_double.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test_fwd_double.cpp -o /dev/null
          echo "pragma once idempotence confirmed"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with strict warnings
        run: |
          g++-13 -std=c++20 \
            -Wall -Wextra -Wpedantic \
            -Wconversion -Wsign-conversion \
            -Wshadow -Wformat=2 \
            -Werror \
            -DENABLE_TEST_APPLICATION -I./include/fat_p \
            -o test_strict ${{ env.TEST_SRC }}
          echo "No warnings"

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs:
      - linux-gcc
      - linux-clang
      - windows-msvc
      - sanitizer-asan
      - sanitizer-ubsan
      - sanitizer-tsan
      - header-check
      - strict-warnings
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}"       != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}"     != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}"    != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}"  != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}"  != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}"    != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed"
