# =============================================================================
# .github/workflows/run-all-benchmarks.yml
# =============================================================================
# Dispatches every per-component benchmark workflow (alignedvector-benchmarks.yml,
# bitset-benchmarks.yml, etc.) so README badge workflows each get a fresh run.
#
# Does NOT call the compiler aggregate orchestrators (run-all-benchmarks-gcc/clang/msvc).
# Each component workflow already runs GCC, Clang, and MSVC internally.
# tensor-benchmarks.yml covers both Tensor layout and TensorMatmul named linear algebra.
#
# Triggers on push/PR (benchmark paths) or manual workflow_dispatch.
#
# Builds shared benchmark dependency caches ONCE (ensure-deps), then dispatches
# per-component workflows that restore-only. Avoids 21 concurrent ensure-deps
# calls racing on build-benchmark-deps concurrency.
# =============================================================================

name: Run All Benchmarks (All Compilers)

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '100000'
        type: string
  push:
    branches: [main]
    paths:
      - 'components/**/benchmarks/**'
      - 'include/**'
      - 'cmake/**'
      - '.github/workflows/*-benchmarks.yml'
      - '.github/workflows/run-all-benchmarks.yml'
      - '.github/workflows/build-benchmark-deps.yml'
  pull_request:
    paths:
      - 'components/**/benchmarks/**'
      - 'include/**'
      - 'cmake/**'
      - '.github/workflows/*-benchmarks.yml'
      - '.github/workflows/run-all-benchmarks.yml'
      - '.github/workflows/build-benchmark-deps.yml'

jobs:
  ensure-deps:
    name: Ensure Benchmark Dependencies
    uses: ./.github/workflows/build-benchmark-deps.yml
    secrets: inherit

  trigger-benchmarks:
    name: Dispatch Component Benchmarks
    needs: ensure-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Trigger all component benchmark workflows
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          BATCHES: ${{ inputs.batches || '20' }}
          TARGET_WORK: ${{ inputs.target_work || '100000' }}
        run: |
          set -euo pipefail
          total=0
          succeeded=0
          failed=0
          triggered=""

          for f in .github/workflows/*-benchmarks.yml; do
            name=$(basename "$f")

            # This file is the dispatcher, not a component benchmark suite.
            [ "$name" = "run-all-benchmarks.yml" ] && continue

            total=$((total + 1))
            echo "[$total] Triggering $name (batches=$BATCHES, target_work=$TARGET_WORK)..."

            if gh workflow run "$name" \
              -f batches="$BATCHES" \
              -f target_work="$TARGET_WORK" 2>&1; then
              succeeded=$((succeeded + 1))
              triggered="$triggered $name"
            else
              echo "::warning::Failed to trigger $name"
              failed=$((failed + 1))
            fi

            sleep 2
          done

          echo ""
          echo "=============================="
          echo "  Triggered: $succeeded"
          echo "  Failed:    $failed"
          echo "  Total:     $total"
          echo "=============================="

          {
            echo "# Benchmark Dispatch Summary"
            echo ""
            echo "Batches: $BATCHES | Target work: $TARGET_WORK"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Dispatched | $succeeded |"
            echo "| Failed | $failed |"
            echo "| Total | $total |"
            echo ""
            echo "Component workflows triggered:"
            for wf in $triggered; do
              echo "- \`$wf\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
