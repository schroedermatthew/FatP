# =============================================================================
# .github/workflows/run-all-benchmarks.yml
# =============================================================================
# One-click trigger: builds and runs every component benchmark.
# Manual-only (workflow_dispatch) — not triggered by push/PR.
#
# Structure:
#   1. Standard benchmarks (no external deps) — single matrix job
#   2. ThreadPool benchmark (needs TBB + Boost.Asio) — dedicated job
#   3. WorkQueue benchmark (needs moodycamel + Boost.Lockfree) — dedicated job
#   4. Summary job — aggregates all artifacts
#
# Each benchmark compiles against GCC-13 C++20 on ubuntu-24.04 with
# -O3 -DNDEBUG -march=native. Reduced iteration counts keep total
# wall-clock under 30 minutes.
# =============================================================================

name: Run All Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '100000'
        type: string

jobs:
  # ===========================================================================
  # Standard Benchmarks (no external dependencies)
  # ===========================================================================
  standard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AlignedVector
            src: components/AlignedVector/benchmarks/benchmark_AlignedVector.cpp
            extra_flags: ""
            link: ""
          - name: AllocationStrategies
            src: components/AllocationStrategies/benchmarks/benchmark_AllocationStrategies.cpp
            extra_flags: ""
            link: ""
          - name: BitSet
            src: components/BitSet/benchmarks/benchmark_BitSet.cpp
            extra_flags: ""
            link: ""
          - name: CircularBuffer
            src: components/CircularBuffer/benchmarks/benchmark_CircularBuffer.cpp
            extra_flags: ""
            link: ""
          - name: FeatureManager
            src: components/FeatureManager/benchmarks/benchmark_FeatureManager.cpp
            extra_flags: ""
            link: ""
          - name: FlatMapSet
            src: components/FlatMapSet/benchmarks/benchmark_FlatMapSet.cpp
            extra_flags: ""
            link: ""
          - name: FloatingPointComparison
            src: components/FloatingPointComparison/benchmarks/benchmark_FloatingPointComparison.cpp
            extra_flags: ""
            link: ""
          - name: IntrusiveList
            src: components/IntrusiveList/benchmarks/benchmark_IntrusiveList.cpp
            extra_flags: ""
            link: ""
          - name: ObjectPool
            src: components/ObjectPool/benchmarks/benchmark_ObjectPool.cpp
            extra_flags: ""
            link: ""
          - name: PolicyIterator
            src: components/PolicyIterator/benchmarks/benchmark_PolicyIterator.cpp
            extra_flags: ""
            link: ""
          - name: ServiceLocator
            src: components/ServiceLocator/benchmarks/benchmark_ServiceLocator.cpp
            extra_flags: ""
            link: ""
          - name: SlotMap
            src: components/SlotMap/benchmarks/benchmark_SlotMap.cpp
            extra_flags: ""
            link: ""
          - name: SmallVector
            src: components/SmallVector/benchmarks/benchmark_SmallVector.cpp
            extra_flags: ""
            link: ""
          - name: SparseSet
            src: components/SparseSet/benchmarks/benchmark_SparseSet.cpp
            extra_flags: ""
            link: ""
          - name: Stacktrace
            src: components/Stacktrace/benchmarks/benchmark_Stacktrace.cpp
            extra_flags: ""
            link: "-lstdc++exp"
          - name: Stringify
            src: components/Stringify/benchmarks/benchmark_Stringify.cpp
            extra_flags: ""
            link: ""
          - name: StrongId
            src: components/StrongId/benchmarks/benchmark_StrongId.cpp
            extra_flags: ""
            link: ""

    steps:
      - uses: actions/checkout@v4

      - name: Build benchmark
        run: |
          g++-13 -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            ${{ matrix.extra_flags }} \
            ${{ matrix.src }} -o bench_bin -pthread ${{ matrix.link }}

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_bin 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # FatPHashMap Benchmark (tsl::robin_map + ankerl::unordered_dense, C++23)
  # ===========================================================================
  fatp-hash-map:
    name: FatPHashMap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache competitors
        id: cache-hashmap-deps
        uses: actions/cache@v4
        with:
          path: ~/thirdparty
          key: hashmap-thirdparty-gcc-${{ runner.os }}-v2

      - name: Install competitors
        if: steps.cache-hashmap-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/thirdparty
          git clone --depth 1 https://github.com/Tessil/robin-map.git $HOME/thirdparty/robin-map
          git clone --depth 1 https://github.com/martinus/unordered_dense.git $HOME/thirdparty/unordered_dense

      - name: Build benchmark
        run: |
          g++-14 -std=c++23 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty/robin-map/include \
            -I$HOME/thirdparty/unordered_dense/include \
            components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp \
            -o bench_bin -pthread

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_bin 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-FatPHashMap
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # ThreadPool Benchmark (TBB + Boost.Asio)
  # ===========================================================================
  thread-pool:
    name: ThreadPool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install competitors
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev libboost-dev

      - name: Build benchmark
        run: |
          g++-13 -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            components/ThreadPool/benchmarks/benchmark_ThreadPool.cpp \
            -o bench_bin -pthread -ltbb

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_bin 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-ThreadPool
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # WorkQueue Benchmark (moodycamel + Boost.Lockfree)
  # ===========================================================================
  work-queue:
    name: WorkQueue
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install competitors
        run: |
          sudo apt-get update && sudo apt-get install -y libboost-dev
          git clone --depth 1 https://github.com/cameron314/concurrentqueue.git deps/concurrentqueue

      - name: Build benchmark
        run: |
          g++-13 -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I./deps/concurrentqueue \
            components/WorkQueue/benchmarks/benchmark_WorkQueue.cpp \
            -o bench_bin -pthread

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_bin 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-WorkQueue
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Benchmark Summary
    needs: [standard, fatp-hash-map, thread-pool, work-queue]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary — All Components" > summary.md
          echo "" >> summary.md
          echo "Batches: ${{ inputs.batches }} | Target work: ${{ inputs.target_work }}" >> summary.md
          echo "" >> summary.md
          echo "| Component | Status |" >> summary.md
          echo "|-----------|--------|" >> summary.md

          passed=0
          failed=0
          for dir in all-benchmarks/bench-*/; do
            name=$(basename "$dir" | sed 's/^bench-//')
            if [ -f "$dir/benchmark.log" ] && grep -q 'Benchmarks completed' "$dir/benchmark.log"; then
              echo "| $name | PASS |" >> summary.md
              passed=$((passed + 1))
            else
              echo "| $name | FAIL |" >> summary.md
              failed=$((failed + 1))
            fi
          done

          echo "" >> summary.md
          echo "**$passed passed, $failed failed out of $((passed + failed)) benchmarks**" >> summary.md
          echo "" >> summary.md

          # Append tail of each log
          echo "## Individual Results" >> summary.md
          for dir in all-benchmarks/bench-*/; do
            name=$(basename "$dir" | sed 's/^bench-//')
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir/benchmark.log" ]; then
              echo '```' >> summary.md
              tail -80 "$dir/benchmark.log" >> summary.md
              echo '```' >> summary.md
            else
              echo "_No log produced._" >> summary.md
            fi
          done

          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary-all
          path: |
            all-benchmarks/
            summary.md
