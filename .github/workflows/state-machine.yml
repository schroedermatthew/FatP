# =============================================================================
# .github/workflows/state-machine.yml
# =============================================================================
# CI workflow for StateMachine component
#
# Directory structure:
#   Headers:    include/fat_p/StateMachine.h
#   Tests:      components/StateMachine/tests/test_StateMachine.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# Benchmarks: Run separately via statemachine-benchmarks.yml
# =============================================================================

name: StateMachine CI

on:
  workflow_dispatch:
    inputs:
  push:
    paths:
      - 'include/fat_p/StateMachine.h'
      - 'components/StateMachine/tests/test_StateMachine.cpp'
      - 'components/StateMachine/tests/compile_fail/**'
      - '.github/workflows/state-machine.yml'
  pull_request:
    paths:
      - 'include/fat_p/StateMachine.h'
      - 'components/StateMachine/tests/test_StateMachine.cpp'
      - 'components/StateMachine/tests/compile_fail/**'
      - '.github/workflows/state-machine.yml'

env:
  INCLUDE_DIR: include/fat_p
  TEST_SRC: components/StateMachine/tests/test_StateMachine.cpp
  COMPILE_FAIL_DIR: components/StateMachine/tests/compile_fail

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 13
            std: 23
          - version: 14
            std: 20
          - version: 14
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_sm

      - name: Run tests
        run: ./test_sm

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 15
            std: 20
            std_flag: c++20
          - version: 16
            std: 20
            std_flag: c++20
          - version: 16
            std: 23
            std_flag: c++2b
          - version: 17
            std: 20
            std_flag: c++20
          - version: 17
            std: 23
            std_flag: c++23

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=${{ matrix.std_flag }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_sm

      - name: Run tests
        run: ./test_sm

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /wd4324 /EHsc /permissive- /utf-8 /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\StateMachine\tests\test_StateMachine.cpp /Fe:test_sm.exe /link advapi32.lib

      - name: Run tests
        run: .\test_sm.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_sm

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_sm

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_sm

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_sm

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_sm

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_sm

  # ===========================================================================
  # Header Self-Containment (Fat-P Section 6.2)
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test StateMachine.h compiles standalone
        run: |
          echo '#include "StateMachine.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "Header is self-contained"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++ -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "No warnings"

  # ===========================================================================
  # Compile-Fail Tests (StateMachine-specific)
  # ===========================================================================
  compile-fail-gcc:
    name: Compile-Fail GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expected-fail compilation
        run: |
          dir="${{ env.COMPILE_FAIL_DIR }}"
          if [ ! -d "$dir" ]; then
            echo "No compile-fail directory, skipping"
            exit 0
          fi
          
          files=$(find "$dir" -maxdepth 1 -name "compile_fail_*.cpp" 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "No compile-fail files found, skipping"
            exit 0
          fi
          
          for f in $files; do
            echo "Testing: $f"
            if g++ -std=c++20 -Wall -Wextra -Wpedantic \
              -I./include/fat_p \
              -c "$f" -o /dev/null 2>/dev/null; then
              echo "ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "OK: Failed as expected"
          done

  compile-fail-clang:
    name: Compile-Fail Clang
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Expected-fail compilation
        run: |
          dir="${{ env.COMPILE_FAIL_DIR }}"
          if [ ! -d "$dir" ]; then
            echo "No compile-fail directory, skipping"
            exit 0
          fi
          
          files=$(find "$dir" -maxdepth 1 -name "compile_fail_*.cpp" 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "No compile-fail files found, skipping"
            exit 0
          fi
          
          for f in $files; do
            echo "Testing: $f"
            if clang++-16 -std=c++20 -Wall -Wextra -Wpedantic \
              -Wno-gnu-zero-variadic-macro-arguments \
              -I./include/fat_p \
              -c "$f" -o /dev/null 2>/dev/null; then
              echo "ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "OK: Failed as expected"
          done

  compile-fail-msvc:
    name: Compile-Fail MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Expected-fail compilation
        shell: pwsh
        run: |
          $dir = "${{ env.COMPILE_FAIL_DIR }}"
          if (-not (Test-Path $dir)) {
            Write-Host "No compile-fail directory, skipping"
            exit 0
          }
          
          $files = Get-ChildItem -Path $dir -Filter "compile_fail_*.cpp" -File 2>$null | Sort-Object Name
          if ($files.Count -eq 0) {
            Write-Host "No compile-fail files found, skipping"
            exit 0
          }
          
          foreach ($f in $files) {
            Write-Host "Testing: $($f.FullName)"
            
            $output = cl /nologo /std:c++20 /W4 /wd4324 /EHsc /permissive- /utf-8 /Zc:preprocessor /c `
              /I".\include\fat_p" `
              "$($f.FullName)" 2>&1
            
            if ($LASTEXITCODE -eq 0) {
              throw "ERROR: expected compilation failure but succeeded: $($f.Name)"
            }
            Write-Host "OK: Failed as expected"
          }
          exit 0

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs:
      - linux-gcc
      - linux-clang
      - windows-msvc
      - sanitizer-asan
      - sanitizer-ubsan
      - sanitizer-tsan
      - header-check
      - strict-warnings
      - compile-fail-gcc
      - compile-fail-clang
      - compile-fail-msvc
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-msvc.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed"
