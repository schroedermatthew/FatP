# =============================================================================
# .github/workflows/state_machine.yml
# =============================================================================
# CI workflow for StateMachine component
#
# Policy: run tests INDIVIDUALLY (no monolithic test_FatP executable).
# Trigger: MANUAL ONLY (workflow_dispatch).
#
# Runs:
# - StateMachine unit tests (standalone test app)
# - Header hygiene tests (HeaderSelfContained + HeaderIncludeOrder)
# - Sanitizers (ASan/UBSan/TSan) on Linux/Clang
# - Standalone header compile check for StateMachine.h
# - Strict warnings compile (Werror)
# - Compile-fail contract suite (expected-failure compilation) on GCC/Clang/MSVC
# =============================================================================

name: StateMachine CI (manual)

on:
  workflow_dispatch:
    inputs:
      soak_iters:
        description: "Optional: FATP_STATE_MACHINE_SOAK_ITERS (empty = default)"
        required: false
        default: ""

concurrency:
  group: statemachine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FATP_ROOT: FAT_P/FAT_P
  HEADER_DIR: FAT_P/FAT_P/fat_p
  TEST_DIR: FAT_P/FAT_P/tests

  HEADER: FAT_P/FAT_P/fat_p/StateMachine.h

  TEST_SRC: FAT_P/FAT_P/tests/test_StateMachine.cpp
  HYGIENE_SELF: FAT_P/FAT_P/tests/test_StateMachine_HeaderSelfContained.cpp
  HYGIENE_ORDER: FAT_P/FAT_P/tests/test_StateMachine_HeaderIncludeOrder.cpp

  COMPILE_FAIL_DIR: FAT_P/FAT_P/tests/compile_fail

jobs:
  linux-gcc:
    name: linux-gcc (GCC-13, C++20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Fat-P paths
        shell: bash
        run: |
          set -euo pipefail
          test -d "$FATP_ROOT" || { echo "❌ Missing $FATP_ROOT"; exit 1; }
          test -d "$HEADER_DIR" || { echo "❌ Missing $HEADER_DIR"; exit 1; }
          test -d "$TEST_DIR" || { echo "❌ Missing $TEST_DIR"; exit 1; }
          test -f "$TEST_SRC" || { echo "❌ Missing $TEST_SRC"; exit 1; }

      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: Build + run StateMachine unit tests
        shell: bash
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          set -euo pipefail
          mkdir -p build
          g++-13 -std=c++20 -O2 -pthread -Wall -Wextra -Wpedantic \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_gcc
          ./build/test_StateMachine_gcc

      - name: Build + run header hygiene tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for src in "$HYGIENE_SELF" "$HYGIENE_ORDER"; do
            test -f "$src" || { echo "❌ Missing hygiene TU: $src"; exit 1; }
            exe="build/$(basename "$src" .cpp)_gcc"
            g++-13 -std=c++20 -O2 -pthread -Wall -Wextra -Wpedantic \
              -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
              -DENABLE_TEST_APPLICATION \
              "$src" -o "$exe"
            "$exe"
          done

  linux-clang:
    name: linux-clang (Clang-16, C++20)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Fat-P paths
        shell: bash
        run: |
          set -euo pipefail
          test -d "$FATP_ROOT" || { echo "❌ Missing $FATP_ROOT"; exit 1; }
          test -f "$TEST_SRC" || { echo "❌ Missing $TEST_SRC"; exit 1; }

      - name: Install Clang 16
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
          clang++-16 --version

      - name: Build + run StateMachine unit tests
        shell: bash
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          set -euo pipefail
          mkdir -p build
          clang++-16 -std=c++20 -O2 -pthread -Wall -Wextra -Wpedantic \
            -Wno-gnu-zero-variadic-macro-arguments \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_clang
          ./build/test_StateMachine_clang

      - name: Build + run header hygiene tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for src in "$HYGIENE_SELF" "$HYGIENE_ORDER"; do
            test -f "$src" || { echo "❌ Missing hygiene TU: $src"; exit 1; }
            exe="build/$(basename "$src" .cpp)_clang"
            clang++-16 -std=c++20 -O2 -pthread -Wall -Wextra -Wpedantic \
              -Wno-gnu-zero-variadic-macro-arguments \
              -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
              -DENABLE_TEST_APPLICATION \
              "$src" -o "$exe"
            "$exe"
          done

  windows-msvc:
    name: windows-msvc (MSVC, C++20)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Fat-P paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:FATP_ROOT)) { throw "Missing $($env:FATP_ROOT)" }
          if (-not (Test-Path $env:TEST_SRC)) { throw "Missing $($env:TEST_SRC)" }

      - name: Build + run StateMachine unit tests
        shell: pwsh
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null

          cl /nologo /std:c++20 /O2 /W4 /EHsc /permissive- `
            /I "$env:FATP_ROOT" /I "$env:HEADER_DIR" /I "$env:TEST_DIR" `
            /DENABLE_TEST_APPLICATION `
            "$env:TEST_SRC" /Fe:build\test_StateMachine_msvc.exe

          if ($LASTEXITCODE -ne 0) { throw "MSVC compile failed" }
          .\build\test_StateMachine_msvc.exe

      - name: Build + run header hygiene tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null

          $hygiene = @($env:HYGIENE_SELF, $env:HYGIENE_ORDER)
          foreach ($src in $hygiene) {
            if (-not (Test-Path $src)) { throw "Missing hygiene TU: $src" }
            $base = [System.IO.Path]::GetFileNameWithoutExtension($src)
            $exe = "build\\${base}_msvc.exe"

            cl /nologo /std:c++20 /O2 /W4 /EHsc /permissive- `
              /I "$env:FATP_ROOT" /I "$env:HEADER_DIR" /I "$env:TEST_DIR" `
              /DENABLE_TEST_APPLICATION `
              "$src" /Fe:$exe

            if ($LASTEXITCODE -ne 0) { throw "MSVC compile failed for $src" }
            & ".\\$exe"
          }

  sanitizer-asan:
    name: sanitizer-asan (Clang-16)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 16
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
      - name: Build + run (ASan)
        shell: bash
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          set -euo pipefail
          mkdir -p build
          clang++-16 -std=c++20 -O1 -g -fno-omit-frame-pointer -pthread \
            -fsanitize=address \
            -Wall -Wextra -Wpedantic -Wno-gnu-zero-variadic-macro-arguments \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_asan
          ./build/test_StateMachine_asan

  sanitizer-ubsan:
    name: sanitizer-ubsan (Clang-16)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 16
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
      - name: Build + run (UBSan)
        shell: bash
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          set -euo pipefail
          mkdir -p build
          clang++-16 -std=c++20 -O1 -g -fno-omit-frame-pointer -pthread \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -Wall -Wextra -Wpedantic -Wno-gnu-zero-variadic-macro-arguments \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_ubsan
          ./build/test_StateMachine_ubsan

  sanitizer-tsan:
    name: sanitizer-tsan (Clang-16)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 16
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
      - name: Build + run (TSan)
        shell: bash
        env:
          FATP_STATE_MACHINE_SOAK_ITERS: ${{ inputs.soak_iters }}
        run: |
          set -euo pipefail
          mkdir -p build
          clang++-16 -std=c++20 -O1 -g -fno-omit-frame-pointer -pthread \
            -fsanitize=thread \
            -Wall -Wextra -Wpedantic -Wno-gnu-zero-variadic-macro-arguments \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_tsan
          ./build/test_StateMachine_tsan

  header-check:
    name: header-check (StateMachine.h standalone)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Compile StateMachine.h standalone
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HEADER" || { echo "❌ Missing header: $HEADER"; exit 1; }
          mkdir -p build
          cat > build/header_compile.cpp <<'EOF'
#include "StateMachine.h"
int main() { return 0; }
EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I"$FATP_ROOT" -I"$HEADER_DIR" \
            -c build/header_compile.cpp -o /dev/null

  strict-warnings:
    name: strict-warnings (Werror)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Compile (Werror + extra)
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEST_SRC" || { echo "❌ Missing $TEST_SRC"; exit 1; }
          mkdir -p build
          g++-13 -std=c++20 -O2 -pthread \
            -Wall -Wextra -Wpedantic -Werror \
            -Wshadow -Wconversion -Wsign-conversion \
            -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
            -DENABLE_TEST_APPLICATION \
            "$TEST_SRC" -o build/test_StateMachine_werror

  compile-fail-gcc:
    name: compile-fail (GCC-13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 13
        run: sudo apt-get update && sudo apt-get install -y g++-13
      - name: Expected-fail compilation (GCC)
        shell: bash
        run: |
          set -euo pipefail
          dir="$COMPILE_FAIL_DIR"
          test -d "$dir" || { echo "❌ Missing compile-fail dir: $dir"; exit 1; }

          mapfile -t files < <(find "$dir" -maxdepth 1 -name "compile_fail_StateMachine_*.cpp" -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ No compile-fail files found (expected compile_fail_StateMachine_*.cpp)"
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "[COMPILE-FAIL] $f"
            if g++-13 -std=c++20 -Wall -Wextra -Wpedantic \
              -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
              -c "$f" -o /tmp/compile_fail.o; then
              echo "❌ ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "✓ Failed as expected"
          done

  compile-fail-clang:
    name: compile-fail (Clang-16)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 16
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16
      - name: Expected-fail compilation (Clang)
        shell: bash
        run: |
          set -euo pipefail
          dir="$COMPILE_FAIL_DIR"
          test -d "$dir" || { echo "❌ Missing compile-fail dir: $dir"; exit 1; }

          mapfile -t files < <(find "$dir" -maxdepth 1 -name "compile_fail_StateMachine_*.cpp" -print | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ No compile-fail files found (expected compile_fail_StateMachine_*.cpp)"
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "[COMPILE-FAIL] $f"
            if clang++-16 -std=c++20 -Wall -Wextra -Wpedantic \
              -Wno-gnu-zero-variadic-macro-arguments \
              -I"$FATP_ROOT" -I"$HEADER_DIR" -I"$TEST_DIR" \
              -c "$f" -o /tmp/compile_fail.o; then
              echo "❌ ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "✓ Failed as expected"
          done

  compile-fail-msvc:
    name: compile-fail (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Expected-fail compilation (MSVC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:COMPILE_FAIL_DIR
          if (-not (Test-Path $dir)) { throw "Missing compile-fail dir: $dir" }

          $files = Get-ChildItem -Path $dir -Filter 'compile_fail_StateMachine_*.cpp' -File | Sort-Object FullName
          if ($files.Count -eq 0) { throw "No compile-fail files found (expected compile_fail_StateMachine_*.cpp)" }

          foreach ($f in $files) {
            Write-Host "[COMPILE-FAIL] $($f.FullName)"

            cl /nologo /std:c++20 /W4 /EHsc /permissive- /c `
              /I "$env:FATP_ROOT" /I "$env:HEADER_DIR" /I "$env:TEST_DIR" `
              "$($f.FullName)" > $null

            if ($LASTEXITCODE -eq 0) {
              throw "ERROR: expected compilation failure but succeeded: $($f.Name)"
            }
            Write-Host "✓ Failed as expected"
          }

  ci-success:
    name: ci-success
    needs:
      - linux-gcc
      - linux-clang
      - windows-msvc
      - sanitizer-asan
      - sanitizer-ubsan
      - sanitizer-tsan
      - header-check
      - strict-warnings
      - compile-fail-gcc
      - compile-fail-clang
      - compile-fail-msvc
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        shell: bash
        run: |
          set -euo pipefail

          declare -a jobs=(
            linux-gcc
            linux-clang
            windows-msvc
            sanitizer-asan
            sanitizer-ubsan
            sanitizer-tsan
            header-check
            strict-warnings
            compile-fail-gcc
            compile-fail-clang
            compile-fail-msvc
          )

          for j in "${jobs[@]}"; do
            result="${{ needs[j].result }}"
            if [ "$result" != "success" ]; then
              echo "❌ Job failed: $j ($result)"
              exit 1
            fi
          done

          echo "✓ StateMachine CI passed"
