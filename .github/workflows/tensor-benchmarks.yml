# =============================================================================
# .github/workflows/tensor-benchmarks.yml
# =============================================================================
# Standalone, manual-only benchmark workflow for Tensor.
# =============================================================================

name: Tensor Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target logical elements per calibrated batch'
        required: false
        default: '5000000'
        type: string

env:
  BENCH_SRC: components/Tensor/benchmarks/benchmark_Tensor.cpp

jobs:
  benchmarks-gcc:
    name: GCC-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13, 14]
    steps:
      - uses: actions/checkout@v6
      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}
      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} -o bench_tensor -pthread
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: '3'
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: '1'
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp20.csv
          FATP_BENCH_OUTPUT_JSON: results_gcc${{ matrix.version }}_cpp20.json
        run: ./bench_tensor 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-Tensor-gcc${{ matrix.version }}
          path: |
            results_gcc${{ matrix.version }}_cpp20.csv
            results_gcc${{ matrix.version }}_cpp20.json
            benchmark_gcc${{ matrix.version }}_cpp20.log
          if-no-files-found: warn

  benchmarks-clang:
    name: Clang-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]
    steps:
      - uses: actions/checkout@v6
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang-${{ matrix.version }}
      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} -o bench_tensor -pthread
      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: '3'
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: '1'
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp20.csv
          FATP_BENCH_OUTPUT_JSON: results_clang${{ matrix.version }}_cpp20.json
        run: ./bench_tensor 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp20.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-Tensor-clang${{ matrix.version }}
          path: |
            results_clang${{ matrix.version }}_cpp20.csv
            results_clang${{ matrix.version }}_cpp20.json
            benchmark_clang${{ matrix.version }}_cpp20.log
          if-no-files-found: warn

  benchmarks-msvc:
    name: MSVC C++20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build benchmark
        shell: cmd
        run: cl /nologo /std:c++20 /O2 /MD /DNDEBUG /EHsc /permissive- /utf-8 /W4 /WX /wd4324 /wd4127 /I.\include\fat_p ${{ env.BENCH_SRC }} /Fe:bench_tensor.exe /link advapi32.lib
      - name: Run benchmark
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: '3'
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: '1'
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp20.csv
          FATP_BENCH_OUTPUT_JSON: results_msvc_cpp20.json
        run: .\bench_tensor.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp20.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-Tensor-msvc
          path: |
            results_msvc_cpp20.csv
            results_msvc_cpp20.json
            benchmark_msvc_cpp20.log
          if-no-files-found: warn

  benchmark-summary:
    name: Tensor Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: bench-Tensor-*
          path: all-benchmarks
          merge-multiple: false
      - name: Aggregate results
        run: |
          echo '# Tensor Benchmark Summary' > summary.md
          echo '' >> summary.md
          echo '| Job | Status |' >> summary.md
          echo '|-----|--------|' >> summary.md
          echo '| benchmarks-gcc | ${{ needs['benchmarks-gcc'].result }} |' >> summary.md
          echo '| benchmarks-clang | ${{ needs['benchmarks-clang'].result }} |' >> summary.md
          echo '| benchmarks-msvc | ${{ needs['benchmarks-msvc'].result }} |' >> summary.md
          echo '' >> summary.md
          echo '## Individual Results' >> summary.md
          find all-benchmarks -name '*.log' -type f -print0 2>/dev/null | sort -z | while IFS= read -r -d '' log; do
            echo '' >> summary.md
            name=$(basename "$log")
            echo "### $name" >> summary.md
            echo '```text' >> summary.md
            tail -80 "$log" >> summary.md
            echo '```' >> summary.md
          done
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-Tensor-summary
          path: |
            all-benchmarks/
            summary.md
          if-no-files-found: warn
