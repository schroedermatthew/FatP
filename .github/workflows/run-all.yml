# =============================================================================
# .github/workflows/run-all.yml
# =============================================================================
# One-click trigger for all component workflows.
# Uses workflow_dispatch so it only runs when you manually press the button.
# Deletes all previous workflow runs first, then triggers fresh runs.
# =============================================================================

name: Run All Workflows

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete all existing workflow runs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          echo "Deleting all existing workflow runs..."
          deleted=0
          failed=0

          # Get our own run ID so we don't delete ourselves
          my_run_id="${{ github.run_id }}"

          # Paginate through all runs (gh returns 100 per page max)
          while true; do
            run_ids=$(gh run list --limit 100 --json databaseId --jq '.[].databaseId')

            if [ -z "$run_ids" ]; then
              echo "No more runs to delete."
              break
            fi

            for id in $run_ids; do
              # Don't delete the current run
              if [ "$id" = "$my_run_id" ]; then
                continue
              fi

              if gh run delete "$id" 2>/dev/null; then
                deleted=$((deleted + 1))
              else
                failed=$((failed + 1))
              fi
            done

            # Pace to avoid rate limiting
            sleep 1
          done

          echo ""
          echo "=============================="
          echo "  Deleted: $deleted"
          echo "  Failed:  $failed"
          echo "=============================="

      - name: Trigger all component workflows
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          total=0
          succeeded=0
          failed=0

          for f in .github/workflows/*.yml; do
            name=$(basename "$f")

            # Don't trigger ourselves
            [ "$name" = "run-all.yml" ] && continue

            total=$((total + 1))
            echo "[$total] Triggering $name..."

            if gh workflow run "$name" 2>&1; then
              succeeded=$((succeeded + 1))
            else
              echo "  ⚠ Failed to trigger: $name"
              failed=$((failed + 1))
            fi

            # Pace requests to avoid rate limiting
            sleep 2
          done

          echo ""
          echo "=============================="
          echo "  Triggered: $succeeded"
          echo "  Failed:    $failed"
          echo "  Total:     $total"
          echo "=============================="

          if [ $failed -gt 0 ]; then
            echo "::warning::$failed workflow(s) failed to trigger"
          fi
