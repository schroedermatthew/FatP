# =============================================================================
# .github/workflows/run-all.yml
# =============================================================================
# One-click trigger for all component workflows.
# Uses workflow_dispatch so it only runs when you manually press the button.
# =============================================================================

name: Run All Workflows

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger all component workflows
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          total=0
          succeeded=0
          failed=0
          skipped=0

          for f in .github/workflows/*.yml; do
            name=$(basename "$f")

            # Don't trigger ourselves
            [ "$name" = "run-all.yml" ] && continue

            total=$((total + 1))
            echo "[$total] Triggering $name..."

            if gh workflow run "$name" 2>&1; then
              succeeded=$((succeeded + 1))
            else
              echo "  ⚠ Failed to trigger: $name"
              failed=$((failed + 1))
            fi

            # Pace requests to avoid rate limiting
            sleep 2
          done

          echo ""
          echo "=============================="
          echo "  Triggered: $succeeded"
          echo "  Failed:    $failed"
          echo "  Total:     $total"
          echo "=============================="

          if [ $failed -gt 0 ]; then
            echo "::warning::$failed workflow(s) failed to trigger"
          fi
