# =============================================================================
# .github/workflows/run-all.yml
# =============================================================================
# One-click trigger for all component workflows.
# Uses workflow_dispatch so it only runs when you manually press the button.
# Deletes all previous workflow runs first, then triggers fresh runs.
# =============================================================================

name: Run All Workflows

on:
  workflow_dispatch:

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Delete all existing workflow runs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          echo "Deleting all existing workflow runs..."
          deleted=0
          failed=0
          my_run_id="${{ github.run_id }}"

          while true; do
            run_ids=$(gh run list --limit 100 --json databaseId --jq '.[].databaseId')

            if [ -z "$run_ids" ]; then
              break
            fi

            deleted_this_page=0
            for id in $run_ids; do
              if [ "$id" = "$my_run_id" ]; then
                continue
              fi
              if gh run delete "$id" 2>/dev/null; then
                deleted=$((deleted + 1))
                deleted_this_page=$((deleted_this_page + 1))
              else
                failed=$((failed + 1))
              fi
            done

            # Nothing deleted this pass = only our own run remains
            if [ "$deleted_this_page" -eq 0 ]; then
              break
            fi

            sleep 1
          done

          echo ""
          echo "=============================="
          echo "  Deleted: $deleted"
          echo "  Failed:  $failed"
          echo "=============================="

      - name: Trigger all component workflows
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          total=0
          succeeded=0
          failed=0

          for f in .github/workflows/*.yml; do
            name=$(basename "$f")

            # Don't trigger ourselves
            [ "$name" = "run-all.yml" ] && continue

            # Don't trigger build-benchmark-deps (benchmark workflows call it via ensure-deps)
            [ "$name" = "build-benchmark-deps.yml" ] && continue

            # Don't trigger per-component or per-compiler benchmark workflows
            # (run-all-benchmarks.yml orchestrates GCC + Clang + MSVC in one shot)
            case "$name" in
              *-benchmarks.yml|run-all-benchmarks-gcc.yml|run-all-benchmarks-clang.yml|run-all-benchmarks-msvc.yml|fatp-benchmark-runner.yml)
                continue
                ;;
            esac

            total=$((total + 1))
            echo "[$total] Triggering $name..."

            if gh workflow run "$name" 2>&1; then
              succeeded=$((succeeded + 1))
            else
              echo "  ⚠ Failed to trigger: $name"
              failed=$((failed + 1))
            fi

            sleep 2
          done

          echo ""
          echo "=============================="
          echo "  Triggered: $succeeded"
          echo "  Failed:    $failed"
          echo "  Total:     $total"
          echo "=============================="

          if [ $failed -gt 0 ]; then
            echo "::warning::$failed workflow(s) failed to trigger"
          fi
