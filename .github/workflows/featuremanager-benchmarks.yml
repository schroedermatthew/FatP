# =============================================================================
# .github/workflows/featuremanager-benchmarks.yml
# =============================================================================
# Standalone benchmark workflow for FeatureManager.
# Manual dispatch only.
#
# Dependencies:
#   None. FeatureManager is header-only fat_p with no external competitors.
#   No shared caches or ThirdParty libraries required.
#
# Competitor matrix:
#   All platforms:
#     [x] FeatureManager (fat_p)         (no external competitors)
# =============================================================================

name: FeatureManager Benchmarks

on:
  workflow_dispatch:
    inputs:
      batches:
        description: 'Measured batches per benchmark'
        required: false
        default: '20'
        type: string
      target_work:
        description: 'Target ops per batch'
        required: false
        default: '5000000'
        type: string

env:
  BENCH_SRC: components/FeatureManager/benchmarks/benchmark_FeatureManager.cpp

jobs:
  # ===========================================================================
  # Linux GCC Benchmarks
  # ===========================================================================
  benchmarks-gcc:
    name: GCC-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [13, 14]

    steps:
      - uses: actions/checkout@v6

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} \
            -o bench_featuremanager -pthread

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp20.csv
        run: ./bench_featuremanager 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp20.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: bench-FeatureManager-gcc${{ matrix.version }}
          path: |
            results_gcc${{ matrix.version }}_cpp20.csv
            benchmark_gcc${{ matrix.version }}_cpp20.log

  # ===========================================================================
  # Linux Clang Benchmarks
  # ===========================================================================
  benchmarks-clang:
    name: Clang-${{ matrix.version }} C++20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update
          if apt-cache show clang-${{ matrix.version }} > /dev/null 2>&1; then
            sudo apt-get install -y clang-${{ matrix.version }}
          else
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh ${{ matrix.version }}
          fi

      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++20 \
            -O3 -DNDEBUG -march=native \
            -Wno-gnu-zero-variadic-macro-arguments \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} \
            -o bench_featuremanager -pthread

      - name: Run benchmark
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp20.csv
        run: ./bench_featuremanager 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp20.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: bench-FeatureManager-clang${{ matrix.version }}
          path: |
            results_clang${{ matrix.version }}_cpp20.csv
            benchmark_clang${{ matrix.version }}_cpp20.log

  # ===========================================================================
  # Windows MSVC Benchmarks
  # ===========================================================================
  benchmarks-msvc:
    name: MSVC C++20
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build benchmark
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /MD /DNDEBUG /EHsc /permissive- /utf-8 ^
            /Zc:preprocessor /wd4324 /wd4244 /wd4267 ^
            /D_CRT_SECURE_NO_WARNINGS ^
            /I.\include\fat_p ^
            %BENCH_SRC% ^
            /Fe:bench_featuremanager.exe ^
            /link advapi32.lib

      - name: Run benchmark
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_BATCHES: ${{ inputs.batches }}
          FATP_BENCH_TARGET_WORK: ${{ inputs.target_work }}
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp20.csv
        run: .\bench_featuremanager.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp20.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: bench-FeatureManager-msvc
          path: |
            results_msvc_cpp20.csv
            benchmark_msvc_cpp20.log

  # ===========================================================================
  # Benchmark Summary
  # ===========================================================================
  benchmark-summary:
    name: FeatureManager Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: bench-FeatureManager-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# FeatureManager Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Status |" >> summary.md
          echo "|----------|--------|" >> summary.md

          for dir in all-benchmarks/bench-FeatureManager-*/; do
            name=$(basename "$dir" | sed 's/^bench-FeatureManager-//')
            if ls "$dir"/*.log 1>/dev/null 2>&1; then
              echo "| $name | [PASS] |" >> summary.md
            else
              echo "| $name | [FAIL] |" >> summary.md
            fi
          done

          echo "" >> summary.md
          echo "## Individual Results" >> summary.md

          for dir in all-benchmarks/bench-FeatureManager-*/; do
            name=$(basename "$dir" | sed 's/^bench-FeatureManager-//')
            echo "" >> summary.md
            echo "### $name" >> summary.md
            for log in "$dir"/*.log; do
              [ -f "$log" ] && echo '```' >> summary.md && tail -80 "$log" >> summary.md && echo '```' >> summary.md
            done
          done

          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload combined results
        uses: actions/upload-artifact@v5
        with:
          name: bench-FeatureManager-summary
          path: |
            all-benchmarks/
            summary.md
