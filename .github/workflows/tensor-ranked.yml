# =============================================================================
# Fixed-rank, runtime-extents Tensor CI
# =============================================================================

name: TensorRanked CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/fat_p/Tensor*.h'
      - 'include/fat_p/tensor/TensorRanked.h'
      - 'include/fat_p/tensor/Tensor*.h'
      - 'include/fat_p/FatPConcepts.h'
      - 'components/Tensor/tests/**'
      - 'CMakeLists.txt'
      - 'cmake/FatPComponents.cmake'
      - 'components/Tensor/benchmarks/benchmark_TensorRanked.cpp'
      - 'components/Tensor/docs/*Tensor*.md'
      - 'components/Tensor/results/2026-09-04-ranked/**'
      - 'components/FatPTest/tests/IncludeAllFatPHeaders.h'
      - 'components/FatPTest/tests/test_FatP.*'
      - 'include/fat_p/FatPTest.h'
      - 'include/fat_p/FatPBenchmarkRunner.h'
      - 'Read_Me/Fat-P_Library_Development_Guidelines.md'
      - '.github/workflows/tensor-ranked.yml'
  pull_request:
    paths:
      - 'include/fat_p/Tensor*.h'
      - 'include/fat_p/tensor/TensorRanked.h'
      - 'include/fat_p/tensor/Tensor*.h'
      - 'include/fat_p/FatPConcepts.h'
      - 'components/Tensor/tests/**'
      - 'CMakeLists.txt'
      - 'cmake/FatPComponents.cmake'
      - 'components/Tensor/benchmarks/benchmark_TensorRanked.cpp'
      - 'components/Tensor/docs/*Tensor*.md'
      - 'components/Tensor/results/2026-09-04-ranked/**'
      - 'components/FatPTest/tests/IncludeAllFatPHeaders.h'
      - 'components/FatPTest/tests/test_FatP.*'
      - 'include/fat_p/FatPTest.h'
      - 'include/fat_p/FatPBenchmarkRunner.h'
      - 'Read_Me/Fat-P_Library_Development_Guidelines.md'
      - '.github/workflows/tensor-ranked.yml'

env:
  TEST_SRC: components/Tensor/tests/test_TensorRanked.cpp
  MATERIALIZATION_TEST_SRC: components/Tensor/tests/test_TensorMaterialization.cpp
  OWNER_LIFETIME_TEST_SRC: components/Tensor/tests/test_TensorOwnerLifetime.cpp
  HEADER_TEST_SRC: components/Tensor/tests/test_TensorRanked_HeaderSelfContained.cpp
  BENCH_SRC: components/Tensor/benchmarks/benchmark_TensorRanked.cpp

jobs:
  linux:
    name: ${{ matrix.compiler }} C++${{ matrix.std }} ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC-13
            cxx: g++-13
            std: 20
            mode: Debug
            flags: -O0 -g
          - compiler: GCC-14
            cxx: g++-14
            std: 23
            mode: Release
            flags: -O2 -DNDEBUG
          - compiler: Clang-18
            cxx: clang++-18
            std: 20
            mode: Debug
            flags: -O0 -g
          - compiler: Clang-18
            cxx: clang++-18
            std: 23
            mode: Release
            flags: -O2 -DNDEBUG
    steps:
      - uses: actions/checkout@v6
      - name: Build tests
        run: >-
          ${{ matrix.cxx }} -std=c++${{ matrix.std }}
          -Wall -Wextra -Wpedantic -Werror
          ${{ matrix.flags }} -DENABLE_TEST_APPLICATION
          -iquote ./include/fat_p ${{ env.TEST_SRC }} -o test_bin
      - name: Run tests
        run: ./test_bin
      - name: Build materialization regressions without optional copy elision
        run: >-
          ${{ matrix.cxx }} -std=c++${{ matrix.std }}
          -Wall -Wextra -Wpedantic -Werror -fno-elide-constructors
          ${{ matrix.flags }} -DENABLE_TEST_APPLICATION
          -iquote ./include/fat_p ${{ env.MATERIALIZATION_TEST_SRC }} -o materialization_bin
      - name: Run materialization regressions
        run: ./materialization_bin
      - name: Build owner lifetime regressions
        run: >-
          ${{ matrix.cxx }} -std=c++${{ matrix.std }}
          -Wall -Wextra -Wpedantic -Werror -pthread
          ${{ matrix.flags }} -DENABLE_TEST_APPLICATION
          -iquote ./include/fat_p ${{ env.OWNER_LIFETIME_TEST_SRC }} -o owner_lifetime_bin
      - name: Run owner lifetime regressions
        run: ./owner_lifetime_bin

  windows-msvc:
    name: MSVC C++${{ matrix.std }} ${{ matrix.mode }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: 20
            stdflag: /std:c++20
            mode: Debug
            opt: /Od /Zi
          - std: 23
            stdflag: /std:c++latest
            mode: Release
            opt: /O2 /DNDEBUG
    steps:
      - uses: actions/checkout@v6
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Build tests
        shell: cmd
        run: >-
          cl ${{ matrix.stdflag }} ${{ matrix.opt }} /W4 /WX /wd4324 /wd4127
          /EHsc /permissive- /Zc:preprocessor /DENABLE_TEST_APPLICATION
          /I.\include\fat_p ${{ env.TEST_SRC }} /Fe:test_bin.exe /link advapi32.lib
      - name: Run tests
        run: .\test_bin.exe
      - name: Build materialization regressions without optional copy elision
        shell: cmd
        run: >-
          cl ${{ matrix.stdflag }} ${{ matrix.opt }} /W4 /WX /wd4324 /wd4127
          /EHsc /permissive- /Zc:preprocessor /Zc:nrvo- /DENABLE_TEST_APPLICATION
          /I.\include\fat_p ${{ env.MATERIALIZATION_TEST_SRC }} /Fe:materialization_bin.exe /link advapi32.lib
      - name: Run materialization regressions
        run: .\materialization_bin.exe
      - name: Build owner lifetime regressions
        shell: cmd
        run: >-
          cl ${{ matrix.stdflag }} ${{ matrix.opt }} /W4 /WX /wd4324 /wd4127
          /EHsc /permissive- /Zc:preprocessor /DENABLE_TEST_APPLICATION
          /I.\include\fat_p ${{ env.OWNER_LIFETIME_TEST_SRC }} /Fe:owner_lifetime_bin.exe /link advapi32.lib
      - name: Run owner lifetime regressions
        run: .\owner_lifetime_bin.exe

  windows-clang-debug:
    name: Windows Clang full Debug Tensor suite
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure full Debug build
        run: >-
          cmake -S . -B build-clang-debug -G Ninja
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DFATP_BUILD_BENCHMARKS=OFF
      - name: Build every Tensor test with debug information and assertions
        run: |
          targets=()
          for source in components/*/tests/test_Tensor*.cpp; do
            name="${source##*/}"
            targets+=("${name%.cpp}")
          done
          cmake --build build-clang-debug --parallel 2 --target "${targets[@]}"
      - name: Run every Tensor test
        run: ctest --test-dir build-clang-debug -R '^test_Tensor' --output-on-failure --no-tests=error

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            sanitizer: address
            options: ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          - name: UndefinedBehaviorSanitizer
            sanitizer: undefined
            options: UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          - name: ThreadSanitizer
            sanitizer: thread
            options: TSAN_OPTIONS=halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: >-
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer
          -DENABLE_TEST_APPLICATION -iquote ./include/fat_p
          ${{ env.TEST_SRC }} -o test_bin
      - name: Run
        run: ${{ matrix.options }} ./test_bin
      - name: Build materialization regressions
        run: >-
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g
          -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -fno-elide-constructors
          -DENABLE_TEST_APPLICATION -iquote ./include/fat_p
          ${{ env.MATERIALIZATION_TEST_SRC }} -o materialization_bin
      - name: Run materialization regressions
        run: ${{ matrix.options }} ./materialization_bin
      - name: Build owner lifetime regressions
        run: >-
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -O1 -g -pthread
          -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer
          -DENABLE_TEST_APPLICATION -iquote ./include/fat_p
          ${{ env.OWNER_LIFETIME_TEST_SRC }} -o owner_lifetime_bin
      - name: Run owner lifetime regressions
        run: ${{ matrix.options }} ./owner_lifetime_bin

  header-and-hygiene:
    name: Header, warnings, and metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Header self-containment
        run: >-
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror
          -iquote ./include/fat_p -c ${{ env.HEADER_TEST_SRC }} -o header.o
      - name: Include order independence
        run: |
          printf '#include <algorithm>\n#include <vector>\n#include "TensorRanked.h"\nint main() { return 0; }\n' > include_order.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -iquote ./include/fat_p include_order.cpp -o include_order
      - name: Strict warnings
        run: >-
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic
          -Wconversion -Wsign-conversion -Wshadow -Wformat=2 -Werror
          -DENABLE_TEST_APPLICATION -iquote ./include/fat_p
          ${{ env.TEST_SRC }} -o strict_test
      - name: Benchmark compile
        run: >-
          g++-13 -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Werror
          -iquote ./include/fat_p ${{ env.BENCH_SRC }} -o benchmark_tensor_ranked
      - name: Install architecture-check tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Architecture grep manifest
        run: |
          ! rg -n 'same_as<.*(DynamicExtents|TensorLayout)' include/fat_p/tensor
          ! rg -n 'validate\([^)]*\).*\{\s*\}' include/fat_p/tensor/TensorView.h
          ! rg -n 'Tensor<[^,>]+,\s*[^,>]+>&\s+(result|destination)' include/fat_p/tensor
          ! rg -n 'Ranked.*(forEach|while|offset)|Tensor<.*>\s+(temporary|intermediate|materialized)' include/fat_p/tensor
          ! rg -n '^class TensorIterationPlan$' include/fat_p/tensor/TensorIterationPlan.h
          rg -n 'TensorRanked.h' include/fat_p/TensorRanked.h include/fat_p/tensor/TensorRanked.h components/FatPTest/tests/IncludeAllFatPHeaders.h include/fat_p/FatPTest.h
          rg -n 'test_TensorRanked' components/FatPTest/tests/test_FatP.h components/FatPTest/tests/test_FatP.cpp
      - name: Metadata inventory
        run: python3 tools/fatp_meta_inventory.py
      - name: Layer validation
        run: python3 tools/validate_layers.py

  ci-success:
    name: CI Success
    needs: [linux, windows-msvc, windows-clang-debug, sanitizers, header-and-hygiene]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          test '${{ needs.linux.result }}' = success
          test '${{ needs.windows-msvc.result }}' = success
          test '${{ needs.windows-clang-debug.result }}' = success
          test '${{ needs.sanitizers.result }}' = success
          test '${{ needs.header-and-hygiene.result }}' = success
