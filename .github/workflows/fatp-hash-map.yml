# =============================================================================
# .github/workflows/fatp-hash-map.yml
# =============================================================================
# CI workflow for FatPHashMap component (FastHashMap + StableHashMap)
#
# Directory structure:
#   Headers:    include/fat_p/FastHashMap.h
#               include/fat_p/StableHashMap.h
#   Tests:      components/FatPHashMap/tests/test_FastHashMap.cpp
#               components/FatPHashMap/tests/test_StableHashMap.cpp
#   Benchmarks: components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp
#
# Benchmarks are run separately via fatp-hash-map-benchmarks.yml
# (manual dispatch only).
#
# Fat-P Guidelines compliance:
#   - CI Style Guide Section 5: Required jobs
#   - CI Style Guide Section 6: Compiler version matrix
#   - CI Style Guide Section 15: Canonical workflow template
# =============================================================================

name: FatPHashMap CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/fat_p/FastHashMap.h'
      - 'include/fat_p/StableHashMap.h'
      - 'components/FatPHashMap/tests/test_FastHashMap.cpp'
      - 'components/FatPHashMap/tests/test_StableHashMap.cpp'
      - 'components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp'
      - '.github/workflows/fatp-hash-map.yml'
  pull_request:
    paths:
      - 'include/fat_p/FastHashMap.h'
      - 'include/fat_p/StableHashMap.h'
      - 'components/FatPHashMap/tests/test_FastHashMap.cpp'
      - 'components/FatPHashMap/tests/test_StableHashMap.cpp'
      - 'components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp'
      - '.github/workflows/fatp-hash-map.yml'

env:
  HEADER_FAST: FastHashMap.h
  HEADER_STABLE: StableHashMap.h
  TEST_FAST: components/FatPHashMap/tests/test_FastHashMap.cpp
  TEST_STABLE: components/FatPHashMap/tests/test_StableHashMap.cpp
  BENCH_SRC: components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds (C++20/C++23)
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 14
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build and run FastHashMap tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_FAST }} -o test_fast
          ./test_fast

      - name: Build and run StableHashMap tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_STABLE }} -o test_stable
          ./test_stable

  # ===========================================================================
  # Linux Clang Builds (C++20/C++23)
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build and run FastHashMap tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_FAST }} -o test_fast
          ./test_fast

      - name: Build and run StableHashMap tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_STABLE }} -o test_stable
          ./test_stable

  # ===========================================================================
  # Windows MSVC Builds (C++20/C++23)
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run FastHashMap tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /EHsc /permissive- /Zc:preprocessor /wd4324 /D_CRT_SECURE_NO_WARNINGS /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p ${{ env.TEST_FAST }} /Fe:test_fast.exe /link advapi32.lib
          .\test_fast.exe

      - name: Build and run StableHashMap tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /EHsc /permissive- /Zc:preprocessor /wd4324 /D_CRT_SECURE_NO_WARNINGS /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p ${{ env.TEST_STABLE }} /Fe:test_stable.exe /link advapi32.lib
          .\test_stable.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_FAST }} -o test_fast
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_fast

      - name: Build and run StableHashMap with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_STABLE }} -o test_stable
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_stable

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_FAST }} -o test_fast
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_fast

      - name: Build and run StableHashMap with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_STABLE }} -o test_stable
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_stable

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_FAST }} -o test_fast
          TSAN_OPTIONS=halt_on_error=1 ./test_fast

      - name: Build and run StableHashMap with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_STABLE }} -o test_stable
          TSAN_OPTIONS=halt_on_error=1 ./test_stable

  # ===========================================================================
  # Header Self-Containment
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test FastHashMap.h compiles standalone
        run: |
          echo '#include "FastHashMap.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          echo "[OK] FastHashMap.h is self-contained"

      - name: Test StableHashMap.h compiles standalone
        run: |
          echo '#include "StableHashMap.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          echo "[OK] StableHashMap.h is self-contained"

      - name: Test include order independence (FastHashMap)
        run: |
          cat > test1.cpp << 'EOF'
          #include "FastHashMap.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "FastHashMap.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test2.cpp -o /dev/null
          echo "[OK] FastHashMap.h include order independent"

      - name: Test include order independence (StableHashMap)
        run: |
          cat > test1.cpp << 'EOF'
          #include "StableHashMap.h"
          #include <vector>
          #include <algorithm>
          int main() { return 0; }
          EOF
          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "StableHashMap.h"
          int main() { return 0; }
          EOF
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test2.cpp -o /dev/null
          echo "[OK] StableHashMap.h include order independent"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile FastHashMap with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_fast ${{ env.TEST_FAST }}
          echo "[OK] FastHashMap - no warnings"

      - name: Compile StableHashMap with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_stable ${{ env.TEST_STABLE }}
          echo "[OK] StableHashMap - no warnings"

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, sanitizer-tsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "[OK] All checks passed"
