# =============================================================================
# .github/workflows/fatp-hash-map.yml
# =============================================================================
# CI workflow for FatPHashMap component (FastHashMap + StableHashMap)
#
# Directory structure:
#   Headers:    include/fat_p/FastHashMap.h
#               include/fat_p/StableHashMap.h
#   Tests:      components/FatPHashMap/tests/test_FastHashMap.cpp
#               components/FatPHashMap/tests/test_StableHashMap.cpp
#   Benchmarks: components/FatPHashMap/benchmarks/benchmark_FatPHashMap.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: FatPHashMap CI

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run benchmarks'
        type: boolean
        default: false
env:
  COMPONENT_DIR: components/FatPHashMap

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 20
          - version: 13
            std: 20
          - version: 13
            std: 23
          - version: 14
            std: 20
          - version: 14
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build and run FastHashMap tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp -o test_fast
          ./test_fast

      - name: Build and run StableHashMap tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp -o test_stable
          ./test_stable

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 15
            std: 20
          - version: 16
            std: 20
          - version: 16
            std: 23
          - version: 17
            std: 20
          - version: 17
            std: 23

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build and run FastHashMap tests
        run: |
          # Clang < 17 uses -std=c++2b for C++23, Clang >= 17 uses -std=c++23
          if [[ ${{ matrix.version }} -lt 17 && ${{ matrix.std }} -eq 23 ]]; then
            STD_FLAG="c++2b"
          else
            STD_FLAG="c++${{ matrix.std }}"
          fi
          
          clang++-${{ matrix.version }} -std=$STD_FLAG \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp -o test_fast
          ./test_fast

      - name: Build and run StableHashMap tests
        run: |
          # Clang < 17 uses -std=c++2b for C++23, Clang >= 17 uses -std=c++23
          if [[ ${{ matrix.version }} -lt 17 && ${{ matrix.std }} -eq 23 ]]; then
            STD_FLAG="c++2b"
          else
            STD_FLAG="c++${{ matrix.std }}"
          fi
          
          clang++-${{ matrix.version }} -std=$STD_FLAG \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp -o test_stable
          ./test_stable

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [20, 23]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run FastHashMap tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /EHsc /permissive- /wd4324 /D_CRT_SECURE_NO_WARNINGS /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p ${{ env.COMPONENT_DIR }}\tests\test_FastHashMap.cpp /Fe:test_fast.exe /link advapi32.lib
          .\test_fast.exe

      - name: Build and run StableHashMap tests
        shell: pwsh
        run: |
          $std = "${{ matrix.std }}"
          $stdFlag = if ($std -eq "23") { "/std:c++latest" } else { "/std:c++$std" }
          cl $stdFlag /W4 /WX /EHsc /permissive- /wd4324 /D_CRT_SECURE_NO_WARNINGS /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p ${{ env.COMPONENT_DIR }}\tests\test_StableHashMap.cpp /Fe:test_stable.exe /link advapi32.lib
          .\test_stable.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with ASan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp -o test_fast
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_fast

      - name: Build and run StableHashMap with ASan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp -o test_stable
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 ./test_stable

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with UBSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp -o test_fast
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_fast

      - name: Build and run StableHashMap with UBSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp -o test_stable
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_stable

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run FastHashMap with TSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp -o test_fast
          TSAN_OPTIONS=halt_on_error=1 ./test_fast

      - name: Build and run StableHashMap with TSan
        run: |
          g++ -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp -o test_stable
          TSAN_OPTIONS=halt_on_error=1 ./test_stable

  # ===========================================================================
  # Header Self-Containment (Fat-P Section 6.2)
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test FastHashMap.h compiles standalone
        run: |
          echo '#include "FastHashMap.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "[OK] FastHashMap.h is self-contained"

      - name: Test StableHashMap.h compiles standalone
        run: |
          echo '#include "StableHashMap.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "[OK] StableHashMap.h is self-contained"

  # ===========================================================================
  # Strict Warnings
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile FastHashMap with strict warnings
        run: |
          g++ -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_fast ${{ env.COMPONENT_DIR }}/tests/test_FastHashMap.cpp
          echo "[OK] FastHashMap - no warnings"

      - name: Compile StableHashMap with strict warnings
        run: |
          g++ -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_stable ${{ env.COMPONENT_DIR }}/tests/test_StableHashMap.cpp
          echo "[OK] StableHashMap - no warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++23
    runs-on: ubuntu-latest
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        version: [13, 14]

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev

      - name: Cache third-party libraries
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: ~/thirdparty
          key: hashmap-thirdparty-gcc-${{ runner.os }}-v2

      - name: Install third-party libraries
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/thirdparty
          
          # tsl::robin_map (header-only)
          git clone --depth 1 https://github.com/Tessil/robin-map.git $HOME/thirdparty/robin-map
          
          # ankerl::unordered_dense (header-only)
          git clone --depth 1 https://github.com/martinus/unordered_dense.git $HOME/thirdparty/unordered_dense

      - name: Build benchmarks
        run: |
          g++-${{ matrix.version }} -std=c++23 -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty/robin-map/include \
            -I$HOME/thirdparty/unordered_dense/include \
            ${{ env.COMPONENT_DIR }}/benchmarks/benchmark_FatPHashMap.cpp \
            -o bench_hashmap

      - name: Run benchmarks
        env:
          FATP_BENCH_BATCHES: 15
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp23.csv
        run: ./bench_hashmap 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp23
          path: |
            results_gcc${{ matrix.version }}_cpp23.csv
            benchmark_gcc${{ matrix.version }}_cpp23.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++23
    runs-on: ubuntu-22.04
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        version: [16, 17]

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and Ninja
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}
          sudo apt-get install -y ninja-build libboost-dev

      - name: Cache third-party libraries
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: ~/thirdparty
          key: hashmap-thirdparty-clang-${{ runner.os }}-v2

      - name: Install third-party libraries
        if: steps.cache-thirdparty.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/thirdparty
          
          # tsl::robin_map (header-only)
          git clone --depth 1 https://github.com/Tessil/robin-map.git $HOME/thirdparty/robin-map
          
          # ankerl::unordered_dense (header-only)
          git clone --depth 1 https://github.com/martinus/unordered_dense.git $HOME/thirdparty/unordered_dense

      - name: Build benchmarks
        run: |
          # Clang < 17 uses -std=c++2b for C++23, Clang >= 17 uses -std=c++23
          if [[ ${{ matrix.version }} -lt 17 ]]; then
            STD_FLAG="c++2b"
          else
            STD_FLAG="c++23"
          fi
          
          clang++-${{ matrix.version }} -std=$STD_FLAG -O3 -DNDEBUG -march=native \
            -I./include/fat_p \
            -I$HOME/thirdparty/robin-map/include \
            -I$HOME/thirdparty/unordered_dense/include \
            ${{ env.COMPONENT_DIR }}/benchmarks/benchmark_FatPHashMap.cpp \
            -o bench_hashmap

      - name: Run benchmarks
        env:
          FATP_BENCH_BATCHES: 15
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp23.csv
        run: ./bench_hashmap 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clang${{ matrix.version }}-cpp23
          path: |
            results_clang${{ matrix.version }}_cpp23.csv
            benchmark_clang${{ matrix.version }}_cpp23.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++23
    runs-on: windows-latest
    if: ${{ inputs.run_benchmarks }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache header-only libraries
        id: cache-headeronly
        uses: actions/cache@v4
        with:
          path: thirdparty
          key: hashmap-headeronly-${{ runner.os }}-v2

      - name: Install header-only libraries
        if: steps.cache-headeronly.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path thirdparty
          git clone --depth 1 https://github.com/Tessil/robin-map.git thirdparty/robin-map
          git clone --depth 1 https://github.com/martinus/unordered_dense.git thirdparty/unordered_dense

      - name: Build benchmarks
        shell: pwsh
        run: |
          cl /nologo /std:c++latest /O2 /DNDEBUG /EHsc /permissive- /wd4324 /D_CRT_SECURE_NO_WARNINGS `
            /I.\include\fat_p `
            /I.\thirdparty\robin-map\include `
            /I.\thirdparty\unordered_dense\include `
            ${{ env.COMPONENT_DIR }}\benchmarks\benchmark_FatPHashMap.cpp `
            /Fe:bench_hashmap.exe `
            /link advapi32.lib

      - name: Run benchmarks
        shell: pwsh
        env:
          FATP_BENCH_BATCHES: "15"
          FATP_BENCH_WARMUP_RUNS: "3"
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp23.csv
        run: |
          .\bench_hashmap.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp23.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-msvc-cpp23
          path: |
            results_msvc_cpp23.csv
            benchmark_msvc_cpp23.log

  # ===========================================================================
  # Benchmark Summary (Aggregates all benchmark artifacts)
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.run_benchmarks }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary - FatPHashMap" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Standard | Status |" >> summary.md
          echo "|----------|----------|--------|" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | [OK] |" >> summary.md
            else
              echo "| $name | [X] |" >> summary.md
            fi
          done
          
          echo "" >> summary.md
          echo "## Individual Results" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir"/*.log ]; then
              echo '```' >> summary.md
              tail -50 "$dir"/*.log >> summary.md
              echo '```' >> summary.md
            fi
          done
          
          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, sanitizer-tsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "[OK] All checks passed"
