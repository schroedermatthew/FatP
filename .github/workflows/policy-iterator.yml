# =============================================================================
# .github/workflows/policy-iterator.yml
# =============================================================================
# CI workflow for PolicyIterator component
#
# Directory structure:
#   Headers:    FAT_P/FAT_P/fat_p/PolicyIterator.h, TensorStridePolicy.h, TensorIteration.h
#   Tests:      FAT_P/FAT_P/tests/test_PolicyIterator.cpp
#   Benchmarks: FAT_P/FAT_P/benchmarks/benchmark_PolicyIterator.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: PolicyIterator CI

on:
  push:
    branches: [main, master]
    paths:
      - 'FAT_P/FAT_P/fat_p/PolicyIterator.h'
      - 'FAT_P/FAT_P/fat_p/TensorStridePolicy.h'
      - 'FAT_P/FAT_P/fat_p/TensorIteration.h'
      - 'FAT_P/FAT_P/tests/test_PolicyIterator.cpp'
      - 'FAT_P/FAT_P/benchmarks/benchmark_PolicyIterator.cpp'
      - '.github/workflows/policy-iterator.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'FAT_P/FAT_P/fat_p/PolicyIterator.h'
      - 'FAT_P/FAT_P/fat_p/TensorStridePolicy.h'
      - 'FAT_P/FAT_P/fat_p/TensorIteration.h'
      - 'FAT_P/FAT_P/tests/test_PolicyIterator.cpp'
      - 'FAT_P/FAT_P/benchmarks/benchmark_PolicyIterator.cpp'
  schedule:
    - cron: '0 2 * * 0'  # Weekly benchmarks
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run benchmarks'
        required: false
        default: 'false'
        type: boolean

env:
  INCLUDE_DIR: FAT_P/FAT_P/fat_p
  TEST_SRC: FAT_P/FAT_P/tests/test_PolicyIterator.cpp
  BENCH_SRC: FAT_P/FAT_P/benchmarks/benchmark_PolicyIterator.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11
            std: 17
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run tests
        run: ./test_pi

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run tests
        run: ./test_pi

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        run: |
          cl /std:c++${{ matrix.std }} /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /wd4324 /I.\FAT_P\FAT_P\fat_p FAT_P\FAT_P\tests\test_PolicyIterator.cpp /Fe:test_pi.exe

      - name: Run tests
        run: .\test_pi.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_pi

  sanitizer-ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_pi

  sanitizer-tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_pi

  # ===========================================================================
  # Header Self-Containment (Fat-P §6.2)
  # ===========================================================================
  header-check:
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PolicyIterator.h
        run: |
          echo '#include "PolicyIterator.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./FAT_P/FAT_P/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ PolicyIterator.h is self-contained"

      - name: Check TensorStridePolicy.h
        run: |
          echo '#include "TensorStridePolicy.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./FAT_P/FAT_P/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ TensorStridePolicy.h is self-contained"

      - name: Check TensorIteration.h
        run: |
          echo '#include "TensorIteration.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./FAT_P/FAT_P/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ TensorIteration.h is self-contained"

      - name: Include-order stress test
        run: |
          cat > stress_test.cpp << 'EOF'
          #include <map>
          #include <unordered_set>
          #include <algorithm>
          #include <functional>
          #include <memory>
          #include <sstream>
          #include <vector>
          #include "PolicyIterator.h"
          #include "TensorStridePolicy.h"
          #include "TensorIteration.h"
          #include <set>
          #include <list>
          int main() {
              std::vector<int> d = {1,2,3,4,5,6};
              using Iter = fat_p::iterator::PolicyIterator<int>;
              auto it  = Iter::begin(d.data(), d.data() + 6);
              auto end = Iter::end(d.data(), d.data() + 6);
              int sum = 0;
              for (; it != end; ++it) sum += *it;
              if (sum != 21) return 1;
              int64_t tsum = 0;
              fat_p::iterator::iterateND(d.data(), {2, 3}, [&](int v) { tsum += v; });
              return (tsum == 21) ? 0 : 1;
          }
          EOF
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./FAT_P/FAT_P/fat_p -o stress_test stress_test.cpp
          ./stress_test
          echo "✓ Include-order stress test passed"

  # ===========================================================================
  # Strict Warnings Check
  # ===========================================================================
  strict-warnings:
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++ -std=c++17 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./FAT_P/FAT_P/fat_p \
              -o test_strict FAT_P/FAT_P/tests/test_PolicyIterator.cpp
          echo "✓ No warnings"

  # ===========================================================================
  # Benchmarks (Weekly/Manual)
  # ===========================================================================
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "✓ AVX2 supported"
          else
            echo "⚠ AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          g++ -std=c++17 -O3 -DNDEBUG -march=native -mavx2 \
            -I./FAT_P/FAT_P/fat_p \
            FAT_P/FAT_P/benchmarks/benchmark_PolicyIterator.cpp -o bench_pi

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results.csv
        run: ./bench_pi 2>&1 | tee benchmark.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results.csv
            benchmark.log

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
