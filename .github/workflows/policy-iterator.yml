# =============================================================================
# .github/workflows/policy-iterator.yml
# =============================================================================
# CI workflow for PolicyIterator component
#
# Directory structure:
#   Headers:    include/fat_p/PolicyIterator.h, TensorStridePolicy.h, TensorIteration.h
#   Tests:      components/PolicyIterator/tests/test_PolicyIterator.cpp
#   Benchmarks: components/PolicyIterator/benchmarks/benchmark_PolicyIterator.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: PolicyIterator CI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
env:
  INCLUDE_DIR: include/fat_p
  TEST_SRC: components/PolicyIterator/tests/test_PolicyIterator.cpp
  BENCH_SRC: components/PolicyIterator/benchmarks/benchmark_PolicyIterator.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11
            std: 17
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/PolicyIterator/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run tests
        run: ./test_pi

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/PolicyIterator/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run tests
        run: ./test_pi

  # ===========================================================================
  # Windows MSVC Build
  # ===========================================================================
  windows-msvc:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        run: |
          cl /std:c++${{ matrix.std }} /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /wd4324 /I.\FAT_P\FAT_P\fat_p FAT_P\FAT_P\tests\test_PolicyIterator.cpp /Fe:test_pi.exe /link advapi32.lib

      - name: Run tests
        run: .\test_pi.exe

  # ===========================================================================
  # Sanitizers
  # ===========================================================================
  sanitizer-asan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/PolicyIterator/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_pi

  sanitizer-ubsan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/PolicyIterator/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_pi

  sanitizer-tsan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/PolicyIterator/tests/test_PolicyIterator.cpp -o test_pi

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_pi

  # ===========================================================================
  # Header Self-Containment (Fat-P §6.2)
  # ===========================================================================
  header-check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PolicyIterator.h
        run: |
          echo '#include "PolicyIterator.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ PolicyIterator.h is self-contained"

      - name: Check TensorStridePolicy.h
        run: |
          echo '#include "TensorStridePolicy.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ TensorStridePolicy.h is self-contained"

      - name: Check TensorIteration.h
        run: |
          echo '#include "TensorIteration.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ TensorIteration.h is self-contained"

      - name: Include-order stress test
        run: |
          cat > stress_test.cpp << 'EOF'
          #include <map>
          #include <unordered_set>
          #include <algorithm>
          #include <functional>
          #include <memory>
          #include <sstream>
          #include <vector>
          #include "PolicyIterator.h"
          #include "TensorStridePolicy.h"
          #include "TensorIteration.h"
          #include <set>
          #include <list>
          int main() {
              std::vector<int> d = {1,2,3,4,5,6};
              using Iter = fat_p::iterator::PolicyIterator<int>;
              auto it  = Iter::begin(d.data(), d.data() + 6);
              auto end = Iter::end(d.data(), d.data() + 6);
              int sum = 0;
              for (; it != end; ++it) sum += *it;
              if (sum != 21) return 1;
              int64_t tsum = 0;
              fat_p::iterator::iterateND(d.data(), {2, 3}, [&](int v) { tsum += v; });
              return (tsum == 21) ? 0 : 1;
          }
          EOF
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p -o stress_test stress_test.cpp
          ./stress_test
          echo "✓ Include-order stress test passed"

  # ===========================================================================
  # Strict Warnings Check
  # ===========================================================================
  strict-warnings:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++ -std=c++17 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict components/PolicyIterator/tests/test_PolicyIterator.cpp
          echo "✓ No warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Weekly/Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11
            std: 17
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev \
            libeigen3-dev \
            librange-v3-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/iterator, boost/multi_array)"
          echo "  - Eigen3"
          echo "  - range-v3"

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "✓ AVX2 supported"
          else
            echo "⚠ AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            -I/usr/include/eigen3 \
            components/PolicyIterator/benchmarks/benchmark_PolicyIterator.cpp -o bench_pi

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_pi 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Weekly/Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev \
            libeigen3-dev \
            librange-v3-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/iterator, boost/multi_array)"
          echo "  - Eigen3"
          echo "  - range-v3"

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "✓ AVX2 supported"
          else
            echo "⚠ AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            -I/usr/include/eigen3 \
            components/PolicyIterator/benchmarks/benchmark_PolicyIterator.cpp -o bench_pi

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_pi 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clang${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Weekly/Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install competitor libraries via vcpkg
        run: |
          vcpkg install boost-iterator:x64-windows
          vcpkg install boost-multi-array:x64-windows
          vcpkg install eigen3:x64-windows
          vcpkg install range-v3:x64-windows
          
          echo "Installed competitor libraries via vcpkg"

      - name: Build benchmark
        shell: pwsh
        run: |
          cl /nologo /std:c++${{ matrix.std }} /O2 /DNDEBUG /arch:AVX2 /EHsc /permissive- /wd4324 /I.\FAT_P\FAT_P\fat_p /I"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" FAT_P\FAT_P\benchmarks\benchmark_PolicyIterator.cpp /Fe:bench_pi.exe /link advapi32.lib

      - name: Run benchmarks
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp${{ matrix.std }}.csv
        run: |
          .\bench_pi.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-msvc-cpp${{ matrix.std }}
          path: |
            results_msvc_cpp${{ matrix.std }}.csv
            benchmark_msvc_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmark Summary (Aggregates all benchmark artifacts)
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (always() && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true')) }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Standard | Status |" >> summary.md
          echo "|----------|----------|--------|" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | ✓ |" >> summary.md
            else
              echo "| $name | ✗ |" >> summary.md
            fi
          done
          
          echo "" >> summary.md
          echo "## Individual Results" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir"/*.log ]; then
              echo '```' >> summary.md
              tail -50 "$dir"/*.log >> summary.md
              echo '```' >> summary.md
            fi
          done
          
          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (always()) }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
