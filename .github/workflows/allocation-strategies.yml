# =============================================================================
# .github/workflows/allocation-strategies.yml
# =============================================================================
# CI workflow for AllocationStrategies component
#
# Directory structure:
#   Headers:    include/fat_p/AllocationStrategies.h
#   Tests:      components/AllocationStrategies/tests/test_AllocationStrategies.cpp
#   Benchmarks: components/AllocationStrategies/benchmarks/benchmark_AllocationStrategies.cpp
#
# Fat-P Guidelines compliance:
#   - Section 6.1: Include-all compile test
#   - Section 6.2: Header self-contained tests
#   - Section 6.4: Warning cleanliness (-Wall -Wextra -Wpedantic -Werror)
# =============================================================================

name: AllocationStrategies CI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
env:
  INCLUDE_DIR: include/fat_p
  TEST_SRC: components/AllocationStrategies/tests/test_AllocationStrategies.cpp
  BENCH_SRC: components/AllocationStrategies/benchmarks/benchmark_AllocationStrategies.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds
  # ===========================================================================
  linux-gcc:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 11
            std: 17
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/AllocationStrategies/tests/test_AllocationStrategies.cpp -o test_as

      - name: Run tests
        run: ./test_as

  # ===========================================================================
  # Linux Clang Builds
  # ===========================================================================
  linux-clang:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/AllocationStrategies/tests/test_AllocationStrategies.cpp -o test_as

      - name: Run tests
        run: ./test_as

  # ===========================================================================
  # Windows MSVC Builds
  # ===========================================================================
  windows-msvc:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        run: |
          cl /std:c++${{ matrix.std }} /W4 /WX /EHsc /permissive- /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\FAT_P\FAT_P\fat_p FAT_P\FAT_P\tests\test_AllocationStrategies.cpp /Fe:test_as.exe /link advapi32.lib

      - name: Run tests
        run: .\test_as.exe

  # ===========================================================================
  # Sanitizer Jobs
  # ===========================================================================
  sanitizer-asan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/AllocationStrategies/tests/test_AllocationStrategies.cpp -o test_as

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_as

  sanitizer-ubsan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with UBSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/AllocationStrategies/tests/test_AllocationStrategies.cpp -o test_as

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_as

  sanitizer-tsan:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with TSan
        run: |
          g++ -std=c++17 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            components/AllocationStrategies/tests/test_AllocationStrategies.cpp -o test_as

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_as

  # ===========================================================================
  # Header Self-Containment Check
  # ===========================================================================
  header-check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Header Self-Containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test AllocationStrategies.h compiles standalone
        run: |
          echo '#include "AllocationStrategies.h"' > test_include.cpp
          echo 'int main() { return 0; }' >> test_include.cpp
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null
          
          echo "✓ Header is self-contained"

      - name: Test include order independence
        run: |
          # AllocationStrategies first
          cat > test1.cpp << 'EOF'
          #include "AllocationStrategies.h"
          #include <vector>
          #include <algorithm>
          int main() {
              fat_p::NewDeleteAllocator<int> alloc;
              int* p = alloc.allocate(42);
              alloc.deallocate(p);
              return 0;
          }
          EOF
          
          # AllocationStrategies last
          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "AllocationStrategies.h"
          int main() {
              fat_p::BlockAllocator<long> alloc;
              long* p = alloc.allocate(42);
              alloc.deallocate(p);
              return 0;
          }
          EOF
          
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p -c test1.cpp -o /dev/null
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p -c test2.cpp -o /dev/null
          
          echo "✓ Include order independent"

  # ===========================================================================
  # Strict Warnings Check
  # ===========================================================================
  strict-warnings:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    name: Strict Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with strict warnings
        run: |
          g++ -std=c++17 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict components/AllocationStrategies/tests/test_AllocationStrategies.cpp
          echo "✓ No warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Weekly/Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 12
            std: 17
          - version: 12
            std: 20
          - version: 13
            std: 17
          - version: 13
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/pool)"

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "✓ AVX2 supported"
          else
            echo "⚠ AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            components/AllocationStrategies/benchmarks/benchmark_AllocationStrategies.cpp -o bench_as -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_as 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Weekly/Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 14
            std: 17
          - version: 15
            std: 17
          - version: 15
            std: 20
          - version: 16
            std: 17
          - version: 16
            std: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Install competitor libraries
        run: |
          sudo apt-get install -y \
            libboost-dev
          
          echo "Installed competitor libraries:"
          echo "  - Boost (boost/pool)"

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "✓ AVX2 supported"
          else
            echo "⚠ AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            components/AllocationStrategies/benchmarks/benchmark_AllocationStrategies.cpp -o bench_as -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_as 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-clang${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Weekly/Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        std: [17, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install competitor libraries via vcpkg
        run: |
          vcpkg install boost-pool:x64-windows
          
          echo "Installed competitor libraries via vcpkg"

      - name: Build benchmark
        shell: pwsh
        run: |
          cl /nologo /std:c++${{ matrix.std }} /O2 /DNDEBUG /arch:AVX2 /EHsc /permissive- /I.\FAT_P\FAT_P\fat_p /I"$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\include" FAT_P\FAT_P\benchmarks\benchmark_AllocationStrategies.cpp /Fe:bench_as.exe /link advapi32.lib

      - name: Run benchmarks
        shell: pwsh
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp${{ matrix.std }}.csv
        run: |
          .\bench_as.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-msvc-cpp${{ matrix.std }}
          path: |
            results_msvc_cpp${{ matrix.std }}.csv
            benchmark_msvc_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmark Summary (Aggregates all benchmark artifacts)
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (always() && (github.event_name == 'schedule' || github.event.inputs.run_benchmarks == 'true')) }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary - AllocationStrategies" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Standard | Status |" >> summary.md
          echo "|----------|----------|--------|" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | ✓ |" >> summary.md
            else
              echo "| $name | ✗ |" >> summary.md
            fi
          done
          
          echo "" >> summary.md
          echo "## Individual Results" >> summary.md
          
          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir"/*.log ]; then
              echo '```' >> summary.md
              tail -50 "$dir"/*.log >> summary.md
              echo '```' >> summary.md
            fi
          done
          
          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate Job
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-ci')) && (always()) }}
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "✓ All checks passed"
