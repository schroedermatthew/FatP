# =============================================================================
# .github/workflows/jet.yml
# =============================================================================
# CI workflow for Jet component
#
# Directory structure:
#   Headers:    include/fat_p/Jet.h
#   Tests:      components/Jet/tests/test_Jet.cpp
# =============================================================================

name: Jet CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/fat_p/Jet.h'
      - 'components/Jet/tests/test_Jet.cpp'
      - 'components/Jet/tests/compile_fail/**'
      - '.github/workflows/jet.yml'
  pull_request:
    paths:
      - 'include/fat_p/Jet.h'
      - 'components/Jet/tests/test_Jet.cpp'
      - 'components/Jet/tests/compile_fail/**'
      - '.github/workflows/jet.yml'

env:
  HEADER: Jet.h
  TEST_SRC: components/Jet/tests/test_Jet.cpp
  COMPILE_FAIL_DIR: components/Jet/tests/compile_fail

jobs:
  # ===========================================================================
  # Linux GCC Builds (C++20/C++23)
  # ===========================================================================
  linux-gcc:

    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 13
            std: 20
          - version: 14
            std: 23
    steps:
      - uses: actions/checkout@v6

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Linux Clang Builds (C++20/C++23)
  # ===========================================================================
  linux-clang:

    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Windows MSVC Builds (C++20/C++23)
  # ===========================================================================
  windows-msvc:

    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: 20
            flag: "/std:c++20"
          - std: 23
            flag: "/std:c++latest"
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tests
        shell: cmd
        run: cl ${{ matrix.flag }} /W4 /WX /wd4324 /wd4127 /EHsc /permissive- /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\Jet\tests\test_Jet.cpp /Fe:test_bin.exe /link advapi32.lib

      - name: Run tests
        run: .\test_bin.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:

    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_bin

  sanitizer-ubsan:

    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_bin

  sanitizer-tsan:

    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_bin

  # ===========================================================================
  # Header Self-Containment (C++20)
  # ===========================================================================
  header-check:

    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Test header compiles standalone
        run: |
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c components/Jet/tests/test_Jet_HeaderSelfContained.cpp -o /dev/null

          echo "Header is self-contained"

      - name: Test include order independence
        run: |
          cat > test1.cpp << 'EOF'
          #include "Jet.h"
          #include <vector>
          #include <algorithm>
          int main() {{ return 0; }}
          EOF

          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "Jet.h"
          int main() {{ return 0; }}
          EOF

          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test2.cpp -o /dev/null

          echo "Include order independent"

  # ===========================================================================
  # Strict Warnings (C++20)
  # ===========================================================================
  strict-warnings:

    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Compile with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "No warnings"

  # ===========================================================================
  # Compile-Fail Tests (Jet-specific)
  # ===========================================================================
  compile-fail-gcc:
    name: Compile-Fail GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Expected-fail compilation
        run: |
          dir="${{ env.COMPILE_FAIL_DIR }}"
          if [ ! -d "$dir" ]; then
            echo "No compile-fail directory, skipping"
            exit 0
          fi

          files=$(find "$dir" -maxdepth 1 -name "compile_fail_*.cpp" 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "No compile-fail files found, skipping"
            exit 0
          fi

          for f in $files; do
            echo "Testing: $f"
            if g++ -std=c++20 -Wall -Wextra -Wpedantic \
              -I./include/fat_p \
              -c "$f" -o /dev/null 2>/dev/null; then
              echo "ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "OK: Failed as expected"
          done

  compile-fail-clang:
    name: Compile-Fail Clang
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Expected-fail compilation
        run: |
          dir="${{ env.COMPILE_FAIL_DIR }}"
          if [ ! -d "$dir" ]; then
            echo "No compile-fail directory, skipping"
            exit 0
          fi

          files=$(find "$dir" -maxdepth 1 -name "compile_fail_*.cpp" 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "No compile-fail files found, skipping"
            exit 0
          fi

          for f in $files; do
            echo "Testing: $f"
            if clang++-16 -std=c++20 -Wall -Wextra -Wpedantic \
              -Wno-gnu-zero-variadic-macro-arguments \
              -I./include/fat_p \
              -c "$f" -o /dev/null 2>/dev/null; then
              echo "ERROR: expected compilation failure but succeeded: $f"
              exit 1
            fi
            echo "OK: Failed as expected"
          done

  compile-fail-msvc:
    name: Compile-Fail MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Expected-fail compilation
        shell: pwsh
        run: |
          $dir = "${{ env.COMPILE_FAIL_DIR }}"
          if (-not (Test-Path $dir)) {
            Write-Host "No compile-fail directory, skipping"
            exit 0
          }

          $files = Get-ChildItem -Path $dir -Filter "compile_fail_*.cpp" -File 2>$null | Sort-Object Name
          if ($files.Count -eq 0) {
            Write-Host "No compile-fail files found, skipping"
            exit 0
          }

          foreach ($f in $files) {
            Write-Host "Testing: $($f.FullName)"

            $output = cl /nologo /std:c++20 /W4 /wd4324 /EHsc /permissive- /utf-8 /Zc:preprocessor /c `
              /I".\include\fat_p" `
              "$($f.FullName)" 2>&1

            if ($LASTEXITCODE -eq 0) {
              throw "ERROR: expected compilation failure but succeeded: $($f.Name)"
            }
            Write-Host "OK: Failed as expected"
          }
          exit 0

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, sanitizer-tsan, header-check, strict-warnings, compile-fail-gcc, compile-fail-clang, compile-fail-msvc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.compile-fail-msvc.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed"
