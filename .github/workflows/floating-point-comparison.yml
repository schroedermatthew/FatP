# =============================================================================
# .github/workflows/floating-point-comparison.yml
# =============================================================================
# CI workflow for FloatingPointComparison component
#
# Directory structure:
#   Headers:    include/fat_p/FloatingPointComparison.h
#   Tests:      components/FloatingPointComparison/tests/test_FloatingPointComparison.cpp
#   Benchmarks: components/FloatingPointComparison/benchmarks/benchmark_FloatingPointComparison.cpp
# =============================================================================

name: FloatingPointComparison CI

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run benchmarks'
        required: false
        default: 'false'
        type: boolean
  push:
    paths:
      - 'include/fat_p/FloatingPointComparison.h'
      - 'components/FloatingPointComparison/tests/test_FloatingPointComparison.cpp'
      - 'components/FloatingPointComparison/benchmarks/benchmark_FloatingPointComparison.cpp'
      - '.github/workflows/floating-point-comparison.yml'
  pull_request:
    paths:
      - 'include/fat_p/FloatingPointComparison.h'
      - 'components/FloatingPointComparison/tests/test_FloatingPointComparison.cpp'
      - 'components/FloatingPointComparison/benchmarks/benchmark_FloatingPointComparison.cpp'
      - '.github/workflows/floating-point-comparison.yml'

env:
  HEADER: FloatingPointComparison.h
  TEST_SRC: components/FloatingPointComparison/tests/test_FloatingPointComparison.cpp
  BENCH_SRC: components/FloatingPointComparison/benchmarks/benchmark_FloatingPointComparison.cpp

jobs:
  # ===========================================================================
  # Linux GCC Builds (C++20/C++23)
  # ===========================================================================
  linux-gcc:

    name: Linux GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 13
            std: 20
          - version: 14
            std: 23
    steps:
      - uses: actions/checkout@v6

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Build tests
        run: |
          LINK_EXTRA=""
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin $LINK_EXTRA

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Linux Clang Builds (C++20/C++23)
  # ===========================================================================
  linux-clang:

    name: Linux Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Build tests
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -Wall -Wextra -Wpedantic -Werror \
            -Wno-gnu-zero-variadic-macro-arguments \
            -O2 -DNDEBUG \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run tests
        run: ./test_bin

  # ===========================================================================
  # Windows MSVC Builds (C++20/C++23)
  # ===========================================================================
  windows-msvc:

    name: Windows MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: 20
            flag: "/std:c++20"
          - std: 23
            flag: "/std:c++latest"
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build tests
        shell: cmd
        run: cl ${{ matrix.flag }} /W4 /WX /wd4324 /wd4127 /EHsc /permissive- /Zc:preprocessor /O2 /DNDEBUG /DENABLE_TEST_APPLICATION /I.\include\fat_p components\FloatingPointComparison\tests\test_FloatingPointComparison.cpp /Fe:test_bin.exe /link advapi32.lib

      - name: Run tests
        run: .\test_bin.exe

  # ===========================================================================
  # Sanitizers (C++20)
  # ===========================================================================
  sanitizer-asan:

    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with ASan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=address -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with ASan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ./test_bin

  sanitizer-ubsan:

    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with UBSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=undefined -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./test_bin

  sanitizer-tsan:

    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build with TSan
        run: |
          g++-13 -std=c++20 -Wall -Wextra -g -O1 \
            -fsanitize=thread -fno-omit-frame-pointer \
            -DENABLE_TEST_APPLICATION \
            -I./include/fat_p \
            ${{ env.TEST_SRC }} -o test_bin

      - name: Run with TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./test_bin

  # ===========================================================================
  # Header Self-Containment (C++20)
  # ===========================================================================
  header-check:

    name: Header Self-Containment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Test header compiles standalone
        run: |
          echo '#include "${{ env.HEADER }}"' > test_include.cpp
          echo 'int main() {{ return 0; }}' >> test_include.cpp

          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -I./include/fat_p \
            -c test_include.cpp -o /dev/null

          echo "Header is self-contained"

      - name: Test include order independence
        run: |
          cat > test1.cpp << 'EOF'
          #include "FloatingPointComparison.h"
          #include <vector>
          #include <algorithm>
          int main() {{ return 0; }}
          EOF

          cat > test2.cpp << 'EOF'
          #include <algorithm>
          #include <vector>
          #include "FloatingPointComparison.h"
          int main() {{ return 0; }}
          EOF

          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test1.cpp -o /dev/null
          g++-13 -std=c++20 -Wall -Wextra -Wpedantic -Werror -I./include/fat_p test2.cpp -o /dev/null

          echo "Include order independent"

  # ===========================================================================
  # Strict Warnings (C++20)
  # ===========================================================================
  strict-warnings:

    name: Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Compile with strict warnings
        run: |
          g++-13 -std=c++20 \
              -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion \
              -Wshadow -Wformat=2 \
              -Werror \
              -DENABLE_TEST_APPLICATION -I./include/fat_p \
              -o test_strict ${{ env.TEST_SRC }}
          echo "No warnings"

  # ===========================================================================
  # Benchmarks - Linux GCC (Manual)
  # ===========================================================================
  benchmarks-gcc:
    name: Benchmark GCC-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-latest
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 13
            std: 20
          - version: 14
            std: 23

    steps:
      - uses: actions/checkout@v6

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y g++-${{ matrix.version }}

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "AVX2 supported"
          else
            echo "AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          g++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} -o bench_bin -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_bin 2>&1 | tee benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-gcc${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_gcc${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_gcc${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Linux Clang (Manual)
  # ===========================================================================
  benchmarks-clang:
    name: Benchmark Clang-${{ matrix.version }} C++${{ matrix.std }}
    runs-on: ubuntu-22.04
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16
            std: 20
          - version: 17
            std: 23

    steps:
      - uses: actions/checkout@v6

      - name: Install Clang
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.version }}

      - name: Check AVX2 support
        run: |
          if grep -q avx2 /proc/cpuinfo; then
            echo "AVX2 supported"
          else
            echo "AVX2 not supported on this runner"
          fi

      - name: Build benchmark
        run: |
          clang++-${{ matrix.version }} -std=c++${{ matrix.std }} \
            -O3 -DNDEBUG -mavx2 -mfma \
            -I./include/fat_p \
            ${{ env.BENCH_SRC }} -o bench_bin -pthread

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: 1
          FATP_BENCH_OUTPUT_CSV: results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
        run: ./bench_bin 2>&1 | tee benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-clang${{ matrix.version }}-cpp${{ matrix.std }}
          path: |
            results_clang${{ matrix.version }}_cpp${{ matrix.std }}.csv
            benchmark_clang${{ matrix.version }}_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmarks - Windows MSVC (Manual)
  # ===========================================================================
  benchmarks-msvc:
    name: Benchmark MSVC C++${{ matrix.std }}
    runs-on: windows-latest
    if: ${{ inputs.run_benchmarks }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: 20
            flag: "/std:c++20"
          - std: 23
            flag: "/std:c++latest"

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build benchmark
        shell: cmd
        run: cl /nologo ${{ matrix.flag }} /W4 /wd4324 /wd4127 /O2 /DNDEBUG /arch:AVX2 /EHsc /permissive- /Zc:preprocessor /I.\include\fat_p components\FloatingPointComparison\benchmarks\benchmark_FloatingPointComparison.cpp /Fe:bench_bin.exe /link advapi32.lib

      - name: Run benchmarks
        env:
          FATP_BENCH_WARMUP_RUNS: 3
          FATP_BENCH_BATCHES: 20
          FATP_BENCH_NO_STABILIZE: "1"
          FATP_BENCH_OUTPUT_CSV: results_msvc_cpp${{ matrix.std }}.csv
        run: |
          .\bench_bin.exe 2>&1 | Tee-Object -FilePath benchmark_msvc_cpp${{ matrix.std }}.log

      - name: Upload results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-msvc-cpp${{ matrix.std }}
          path: |
            results_msvc_cpp${{ matrix.std }}.csv
            benchmark_msvc_cpp${{ matrix.std }}.log

  # ===========================================================================
  # Benchmark Summary
  # ===========================================================================
  benchmark-summary:
    name: Benchmark Summary
    needs: [benchmarks-gcc, benchmarks-clang, benchmarks-msvc]
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.run_benchmarks }}
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: benchmark-*
          path: all-benchmarks
          merge-multiple: false

      - name: Aggregate results
        run: |
          echo "# Benchmark Summary - FloatingPointComparison" > summary.md
          echo "" >> summary.md
          echo "| Compiler | Status |" >> summary.md
          echo "|----------|--------|" >> summary.md

          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            if ls "$dir"/*.csv 1>/dev/null 2>&1; then
              echo "| $name | [PASS] |" >> summary.md
            else
              echo "| $name | [FAIL] |" >> summary.md
            fi
          done

          echo "" >> summary.md
          echo "## Individual Results" >> summary.md

          for dir in all-benchmarks/benchmark-*/; do
            name=$(basename "$dir")
            echo "" >> summary.md
            echo "### $name" >> summary.md
            if [ -f "$dir"/*.log ]; then
              echo '```' >> summary.md
              tail -50 "$dir"/*.log >> summary.md
              echo '```' >> summary.md
            fi
          done

          cat summary.md

      - name: Upload combined results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-summary
          path: |
            all-benchmarks/
            summary.md

  # ===========================================================================
  # CI Gate
  # ===========================================================================
  ci-success:
    name: CI Success
    needs: [linux-gcc, linux-clang, windows-msvc, sanitizer-asan, sanitizer-ubsan, sanitizer-tsan, header-check, strict-warnings]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.linux-gcc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.linux-clang.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.windows-msvc.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-asan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-ubsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.sanitizer-tsan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.header-check.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.strict-warnings.result }}" != "success" ]]; then exit 1; fi
          echo "All checks passed"
